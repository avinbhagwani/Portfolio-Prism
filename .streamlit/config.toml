[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1F4E79"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F8"
textColor = "#1B2533"
linkColor = "#1F4E79"
borderColor = "#E3E7EC"
showWidgetBorder = false
baseRadius = "6px"
font = "Inter, sans-serif"
headingFont = "Inter, sans-serif"
headingFontWeights = [600, 600, 600, 600, 600, 600]

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/Inter-Regular.woff2"
weight = 400

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/Inter-Medium.woff2"
weight = 500

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/Inter-SemiBold.woff2"
weight = 600

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/Inter-Bold.woff2"
weight = 700

[theme.sidebar]
backgroundColor = "#0F2436"
secondaryBackgroundColor = "#17324A"
textColor = "#DCE4EC"
primaryColor = "#E0B15C"
borderColor = "#22405B"
