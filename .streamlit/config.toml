[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1F4E79"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F4EF"
textColor = "#14212E"
linkColor = "#1F4E79"
borderColor = "#E7E3DA"
showWidgetBorder = false
baseRadius = "8px"
font = "Inter, sans-serif"
headingFont = "Inter, sans-serif"
headingFontWeights = [600, 600, 600, 600, 600, 600]

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/Inter-Regular.woff2"
weight = 400

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/Inter-Medium.woff2"
weight = 500

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/Inter-SemiBold.woff2"
weight = 600

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/Inter-Bold.woff2"
weight = 700

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-Regular.woff2"
weight = 400

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-Medium.woff2"
weight = 500

[theme.sidebar]
backgroundColor = "#0A1522"
secondaryBackgroundColor = "#132335"
textColor = "#D5DEE8"
primaryColor = "#D9B36A"
borderColor = "#1D3147"
