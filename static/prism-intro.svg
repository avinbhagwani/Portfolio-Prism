<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="420" height="200">
<defs>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1F4E79" flood-opacity="0.18"/>
  </filter>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#DCE8F3"/>
    <stop offset="0.6" stop-color="#9FBBD6"/>
    <stop offset="1" stop-color="#5E87AE"/>
  </linearGradient>
  <linearGradient id="beamg" gradientUnits="userSpaceOnUse" x1="14" y1="138" x2="164" y2="112">
    <stop offset="0" stop-color="#9AA3AE" stop-opacity="0"/>
    <stop offset="0.4" stop-color="#9AA3AE"/>
    <stop offset="1" stop-color="#6B7480"/>
  </linearGradient>
</defs>
<style>
  .prism { transform-box: fill-box; transform-origin: 50% 70%; opacity: 0;
    animation: rise 0.75s cubic-bezier(.2,.85,.25,1.15) 0.05s forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px) rotate(-8deg) scale(0.8); }
                    to { opacity: 1; transform: none; } }
</style>
<line x1="282" y1="44" x2="410" y2="44" stroke="#E6EBF0" stroke-width="1" opacity="0"><animate attributeName="opacity" to="1" begin="0.9s" dur="0.5s" fill="freeze"/></line><line x1="282" y1="78" x2="410" y2="78" stroke="#E6EBF0" stroke-width="1" opacity="0"><animate attributeName="opacity" to="1" begin="0.9s" dur="0.5s" fill="freeze"/></line><line x1="282" y1="112" x2="410" y2="112" stroke="#E6EBF0" stroke-width="1" opacity="0"><animate attributeName="opacity" to="1" begin="0.9s" dur="0.5s" fill="freeze"/></line><line x1="282" y1="146" x2="410" y2="146" stroke="#E6EBF0" stroke-width="1" opacity="0"><animate attributeName="opacity" to="1" begin="0.9s" dur="0.5s" fill="freeze"/></line>
<line x1="14" y1="138" x2="164" y2="112" stroke="url(#beamg)" stroke-width="3" stroke-linecap="round"
      pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
  <animate attributeName="stroke-dashoffset" from="1" to="0" begin="0.5s" dur="0.4s" fill="freeze"/>
</line>
<g class="prism" filter="url(#shadow)">
  <polygon points="196,44 250,150 142,150" fill="url(#glass)" stroke="#1F4E79" stroke-width="2.2"
           stroke-linejoin="round"/>
  <polygon points="196,44 214,80 178,80" fill="#FFFFFF" opacity="0.35"/>
  <line x1="192" y1="56" x2="154" y2="138" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.6"
        stroke-linecap="round"/>
</g>
