                 calcMode="linear" begin="0.5s" dur="0.52s" fill="freeze"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" begin="0.5s" dur="0.55s" fill="freeze"/>
