<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Inter; src: url("/app/static/fonts/Inter-Regular.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: Inter; src: url("/app/static/fonts/Inter-Medium.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: Inter; src: url("/app/static/fonts/Inter-SemiBold.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: Inter; src: url("/app/static/fonts/Inter-Bold.woff2") format("woff2"); font-weight: 700; }
:root {
  --ink: #1B2533; --ink2: #4A5562; --muted: #8A939E; --line: #E7EBF0; --soft: #F6F8FA;
  --navy: #1F4E79; --red: #D23F4A; --green: #2E8B57; --cash: #C08A2E;
  --pain: 0; --ease: cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: transparent; color: var(--ink);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
body { padding: 4px 4px 14px 4px; }
button { font: inherit; cursor: pointer; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

.stage { position: relative; border-radius: 18px; overflow: hidden; background: #fff; border: 1px solid var(--line);
  box-shadow: 0 1px 2px rgba(20,30,50,.04), 0 12px 32px rgba(20,30,50,.06); isolation: isolate; }
/* losses tint the page: a red wash from the top and a red edge, both growing with the pain */
.stage::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(180deg, rgba(210,63,74, calc(var(--pain) * .10)) 0%, rgba(210,63,74, 0) 55%); }
.stage::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--red); opacity: var(--pain); }
.stage.shake { animation: shake .45s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake { 10%,90% { transform: translateX(-1px); } 20%,80% { transform: translateX(2px); }
  30%,50%,70% { transform: translateX(-2px); } 40%,60% { transform: translateX(2px); } }

.screen { display: none; padding: 30px 34px 28px 34px; }
.screen.on { display: block; animation: rise .55s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.eyebrow { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--navy); font-weight: 600; }
.btn { border: 1px solid var(--navy); background: var(--navy); color: #fff; border-radius: 999px; padding: 11px 20px; font-weight: 500; font-size: 15px;
  display: inline-flex; align-items: center; gap: 8px; transition: transform .15s ease, background .15s ease, box-shadow .2s ease; }
.btn:hover { background: #173E61; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(31,78,121,.22); }
.btn.ghost { background: #fff; color: var(--navy); border-color: #D5DCE3; }
.btn.ghost:hover { background: #F4F7FA; box-shadow: none; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.kbd { font-size: 11px; border: 1px solid currentColor; border-radius: 5px; padding: 0 5px; opacity: .55; font-weight: 500; }
.seg { display: inline-flex; background: var(--soft); border-radius: 999px; padding: 3px; gap: 2px; border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font-size: 13.5px; color: var(--ink2); font-weight: 500;
  transition: background .2s ease, color .2s ease, box-shadow .2s; }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(20,30,50,.12); }
.lbl { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 10px 0; }

/* ---------- setup ---------- */
.s-grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 40px; align-items: center; }
.s-title { font-size: 44px; font-weight: 700; letter-spacing: -.03em; line-height: 1.04; margin: 8px 0 14px 0; }
.s-title em { font-style: normal; color: var(--red); }
.s-lede { font-size: 16px; line-height: 1.62; color: var(--ink2); margin: 0 0 24px 0; }
.s-lede b { color: var(--ink); font-weight: 600; }
.amts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.amts button { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 12px; font-size: 13.5px; color: var(--ink2);
  font-weight: 500; transition: border-color .2s, color .2s, background .2s; }
.amts button.on { border-color: var(--navy); color: var(--navy); background: #F2F6FA; }
.go-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 26px; }
.warn { font-size: 13px; color: var(--muted); }
.mystery { position: relative; height: 230px; border-radius: 16px; background: var(--soft); overflow: hidden; }
.mystery svg { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------- play ---------- */
.p-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.p-name { font-size: 13.5px; color: var(--muted); font-weight: 500; }
.p-date { font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; }
.ctl { display: flex; align-items: center; gap: 10px; }
.icon { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: #fff; display: grid; place-items: center; transition: background .2s; }
.icon:hover { background: var(--soft); }
.icon svg { width: 15px; height: 15px; fill: var(--ink2); }
.pulse { display: flex; align-items: center; gap: 7px; padding: 7px 12px 7px 10px; border-radius: 999px; background: var(--soft);
  border: 1px solid var(--line); font-size: 13px; color: var(--ink2); }
.heart { width: 15px; height: 15px; fill: var(--red); transform-origin: center; animation: beat var(--beat, 1s) infinite; }
@keyframes beat { 0%,100% { transform: scale(1); } 12% { transform: scale(1.28); } 24% { transform: scale(1); } 36% { transform: scale(1.16); } 50% { transform: scale(1); } }

.nums { display: grid; grid-template-columns: 1.45fr 1fr 1fr 1fr 1.15fr 1fr; gap: 8px; margin: 18px 0 12px 0; }
.n { background: var(--soft); border-radius: 12px; padding: 9px 13px 10px 13px; }
.n label { display: block; font-size: 10.5px; color: var(--muted); letter-spacing: .07em; text-transform: uppercase; font-weight: 600; }
.n b { font-size: 19px; font-weight: 700; letter-spacing: -.01em; transition: color .3s ease; }
.n.hero { background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
.n.hero b { font-size: 27px; }
.n b.wait { font-size: 13px; color: var(--muted); font-weight: 500; display: inline-block; padding-top: 6px; }
.n small { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }
.neg { color: var(--red); } .pos { color: var(--green); }

.chartwrap { position: relative; height: 320px; margin: 0 -4px; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 4px 0 0 0; }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; vertical-align: 3px; margin-right: 6px; }

.thoughts { position: absolute; right: 74px; top: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 7px; pointer-events: none; max-width: 56%; }
.thought { background: rgba(255,255,255,.96); border-radius: 10px; padding: 8px 13px; font-size: 13.5px; line-height: 1.4; color: var(--ink);
  box-shadow: 0 6px 20px rgba(20,30,50,.10), 0 0 0 1px var(--line); animation: tin .45s var(--ease) both; border-left: 3px solid var(--line); }
.thought.bad { border-left-color: var(--red); }
.thought.good { border-left-color: var(--green); }
.thought.out { animation: tout .5s ease both; }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes tout { to { opacity: 0; transform: translateY(-6px); } }

.p-bottom { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; padding-top: 14px;
  border-top: 1px solid var(--line); flex-wrap: wrap; }
.status { font-size: 14px; color: var(--ink2); max-width: 38rem; line-height: 1.5; }
.status b { color: var(--ink); }
.sell { border: 0; border-radius: 999px; padding: 13px 22px; font-size: 15px; font-weight: 600; color: #fff; background: var(--red);
  box-shadow: 0 8px 20px rgba(210,63,74,.25); transition: transform .15s ease, background .2s ease; }
.sell:hover { transform: translateY(-1px); background: #BB303B; }
.sell.urge { animation: urge 1.6s ease-in-out infinite; }
@keyframes urge { 0%,100% { box-shadow: 0 0 0 0 rgba(210,63,74,.35), 0 8px 20px rgba(210,63,74,.25); }
  50% { box-shadow: 0 0 0 10px rgba(210,63,74,0), 0 8px 20px rgba(210,63,74,.25); } }
.sell[disabled] { background: var(--soft); color: var(--muted); box-shadow: none; animation: none; cursor: default; }

/* ---------- end ---------- */
.e-h { font-size: 36px; font-weight: 700; letter-spacing: -.025em; line-height: 1.08; margin: 8px 0 12px 0; }
.e-p { font-size: 15.5px; line-height: 1.62; color: var(--ink2); max-width: 48rem; margin: 0 0 22px 0; }
.e-p b { color: var(--ink); }
.e-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 28px; align-items: start; }
.pain { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.cmp { display: flex; flex-direction: column; gap: 10px; }
.crow { display: grid; grid-template-columns: 1fr 112px; gap: 10px; align-items: center; opacity: 0; animation: rise .5s var(--ease) forwards; }
.crow .t { font-size: 13.5px; color: var(--ink2); margin-bottom: 5px; }
.crow.me .t { color: var(--ink); font-weight: 600; }
.crow .bar { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
.crow .bar i { display: block; height: 100%; width: 0; border-radius: 4px; background: #B9C4CF; transition: width 1.1s var(--ease); }
.crow.me .bar i { background: var(--navy); }
.crow.stay .bar i { background: var(--green); }
.crow.cash .bar i { background: var(--cash); }
.crow .v { text-align: right; font-weight: 600; font-size: 14.5px; }
.crow .v small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 500; }
.period { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: -6px 0 10px 0; }
.period b { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.period span { font-size: 14px; color: var(--muted); }
.storms { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 22px 0; }
.storm { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; padding: 5px 10px; border-radius: 999px;
  background: #EEF3F8; color: var(--navy); opacity: 0; animation: rise .45s var(--ease) forwards; }
.storm i { font-style: normal; font-size: 11px; color: var(--muted); font-weight: 500; }
.storm.sold { background: #FBECEC; color: var(--red); }
.storm.missed { background: var(--soft); color: var(--muted); }
.storm svg { width: 12px; height: 12px; }
.gap { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--soft); font-size: 14px; line-height: 1.5; color: var(--ink2); }
.gap b { color: var(--ink); }
.e-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; }
.e-chart { position: relative; height: 200px; margin-top: 14px; }
.foot { font-size: 11.5px; color: var(--muted); margin-top: 18px; line-height: 1.5; }

@media (max-width: 760px) {
  .screen { padding: 20px 16px; }
  .s-grid { grid-template-columns: 1fr; } .mystery { height: 160px; }
  .s-title { font-size: 34px; } .e-h { font-size: 28px; }
  .nums { grid-template-columns: 1fr 1fr; } .n.hero { grid-column: 1 / -1; }
  .chartwrap { height: 250px; }
  .e-grid { grid-template-columns: 1fr; }
  .thoughts { max-width: 90%; right: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; } }
</style>
</head>
<body>
<div class="stage" id="stage">

<!-- SETUP -->
<section class="screen on" id="setup">
  <div class="s-grid">
    <div>
      <div class="eyebrow">PRISM Games</div>
      <div class="s-title">Can you <em>handle</em> it?</div>
      <p class="s-lede" id="lede"></p>
      <div class="lbl">How you invest</div>
      <div class="seg" id="mode"><button data-m="lump" class="on">Lump sum</button><button data-m="sip">Monthly SIP</button></div>
      <div class="amts" id="amts"></div>
      <div class="go-row">
        <button class="btn" id="go">Invest <span class="kbd">Enter</span></button>
        <span class="warn">It plays month by month. You can sell any time.</span>
      </div>
    </div>
    <div class="mystery" id="mystery"></div>
  </div>
</section>

<!-- PLAY -->
<section class="screen" id="play">
  <div class="p-top">
    <div>
      <div class="p-name" id="p-name"></div>
      <div class="p-date" id="p-date"></div>
    </div>
    <div class="ctl">
      <div class="pulse"><svg class="heart" id="heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2 0 3.6 1.1 4.4 2.6h1.8c.8-1.5 2.4-2.6 4.4-2.6 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>
        <span class="num" id="bpm">72</span> bpm</div>
      <div class="seg" id="speed"><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button></div>
      <button class="icon" id="pause" title="Pause (Space)"><svg viewBox="0 0 16 16" id="pause-ico"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg></button>
      <button class="icon" id="skip" title="Skip to the end"><svg viewBox="0 0 16 16"><path d="M2 2.5v11l7-5.5zM9 2.5v11l5.5-5.5z"/></svg></button>
    </div>
  </div>
  <div class="nums">
    <div class="n hero"><label id="l-val">Your money now</label><b class="num" id="v-val">₹0</b></div>
    <div class="n"><label>Put in</label><b class="num" id="v-inv">₹0</b></div>
    <div class="n"><label>Return</label><b class="num" id="v-abs">0%</b></div>
    <div class="n"><label>XIRR</label><b class="num" id="v-xirr">—</b></div>
    <div class="n"><label>Vs. cash</label><b class="num" id="v-cash">₹0</b><small id="v-cash2"></small></div>
    <div class="n"><label>Underwater</label><b class="num" id="v-under">—</b></div>
  </div>
  <div class="chartwrap"><canvas id="cv"></canvas><div class="thoughts" id="thoughts"></div></div>
  <div class="legend"><span><i style="border-color:#1F4E79"></i>Your money</span><span><i style="border-color:#9AA6B2;border-top-style:dashed"></i>What you put in</span>
    <span><i style="border-color:#C08A2E"></i>Same money in cash</span></div>
  <div class="p-bottom">
    <div class="status" id="status"></div>
    <button class="sell" id="sell">I can't handle it. Sell. <span class="kbd">S</span></button>
  </div>
</section>

<!-- END -->
<section class="screen" id="end">
  <div class="eyebrow" id="e-eyebrow"></div>
  <div class="e-h" id="e-h"></div>
  <p class="e-p" id="e-p"></p>
  <div class="period" id="period"></div>
  <div class="storms" id="storms"></div>
  <div class="e-grid">
    <div>
      <div class="lbl">What you went through</div>
      <div class="pain" id="pain"></div>
      <div class="e-chart"><canvas id="cv2"></canvas></div>
    </div>
    <div>
      <div class="lbl">Where the money ended up</div>
      <div class="cmp" id="cmp"></div>
      <div class="gap" id="gap"></div>
    </div>
  </div>
  <div class="e-btns">
    <button class="btn" id="again">Play again <span class="kbd">Enter</span></button>
    <button class="btn ghost" id="other"></button>
  </div>
  <div class="foot" id="foot"></div>
</section>

</div>
<script>
const D = __DATA__;
(() => {
  const $ = id => document.getElementById(id);
  const L = D.levels.map(([d, v]) => ({ t: Date.parse(d + "T00:00:00Z"), v }));
  const CASH = D.cash;
  const DAY = 864e5, YR = 365 * DAY;

  // names for the famous falls, revealed only at the end
  // market storms, by when they hit; revealed only at the end
  const CRISES = [
    ["2000-02", "2001-09", "Dot-com bust", "the dot-com bust", "Dot-com"],
    ["2006-05", "2006-06", "May 2006 crash", "the May 2006 crash", "2006"],
    ["2008-01", "2009-03", "Global financial crisis", "the 2008 global financial crisis", "GFC"],
    ["2010-11", "2011-12", "Euro debt crisis", "the 2011 euro-crisis slump", "Euro crisis"],
    ["2013-05", "2013-08", "Taper tantrum", null, "Taper"],
    ["2015-03", "2016-02", "2015–16 slowdown", "the 2015–16 slowdown", "Slowdown"],
    ["2018-01", "2019-08", "Small and midcap crash", "the 2018 small and midcap crash", "2018 crash"],
    ["2020-02", "2020-04", "Covid crash", "the Covid crash", "Covid"],
    ["2022-01", "2022-06", "Rate hikes and Ukraine war", "the 2022 rate-hike sell-off", "2022"],
    ["2024-09", "2025-04", "2024–25 correction", "the 2024–25 correction", "2024–25"],
  ].map(([a, b, n, long, tag]) => ({ a: Date.parse(a + "-01T00:00:00Z"), b: Date.parse(b + "-28T00:00:00Z"), n, long, tag }));

  // ---------- formatting ----------
  const inr = v => (v < 0 ? "−" : "") + "₹" + Math.round(Math.abs(v)).toLocaleString("en-IN");
  function short(v) {
    const a = Math.abs(v), s = v < 0 ? "−" : "";
    if (a >= 1e7) return s + "₹" + (a / 1e7).toFixed(a >= 1e8 ? 1 : 2) + " Cr";
    if (a >= 1e5) return s + "₹" + (a / 1e5).toFixed(a >= 1e6 ? 1 : 2) + " L";
    if (a >= 1e3) return s + "₹" + (a / 1e3).toFixed(0) + "k";
    return s + "₹" + Math.round(a);
  }
  const pct = (v, d = 1) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d) + "%";
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const monthName = t => { const d = new Date(t); return MON[d.getUTCMonth()] + " " + d.getUTCFullYear(); };
  function dur(ms) {
    const m = Math.max(0, Math.round(ms / (30.44 * DAY))), y = Math.floor(m / 12), r = m % 12;
    if (y === 0) return `${r} month${r === 1 ? "" : "s"}`;
    return `${y} yr${y > 1 ? "s" : ""}` + (r ? ` ${r} mo` : "");
  }
  function elapsedLabel(ms) {           // "Year 2 · Month 5": no calendar dates while you play
    const m = Math.floor(ms / (30.44 * DAY)), y = Math.floor(m / 12) + 1, r = (m % 12) + 1;
    return `Year ${y} · Month ${r}`;
  }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function xirr(flows, endT, endV) {
    const all = [...flows, { t: endT, a: endV }], t0 = all[0].t;
    if ((endT - t0) / DAY < 90) return null;
    const f = r => all.reduce((s, x) => s + x.a / Math.pow(1 + r, (x.t - t0) / YR), 0);
    let lo = -0.99, hi = 10, flo = f(lo);
    if (flo * f(hi) > 0) return null;
    for (let i = 0; i < 80; i++) { const mid = (lo + hi) / 2, fm = f(mid); if (flo * fm <= 0) hi = mid; else { lo = mid; flo = fm; } }
    return (lo + hi) / 2 * 100;
  }

  // XIRR is shown only once the first money has been in for a year: annualising a few
  // months of returns turns a 26% dip into "-70% a year", which is true but misleading
  const yearly = (flows, endT, endV) => (flows.length && endT - flows[0].t >= YR - 2 * DAY) ? xirr(flows, endT, endV) : null;

  // ---------- the worst fall (never shown before the end) ----------
  const worst = D.scenarios.reduce((b, s) => (!b || s.depth < b.depth ? s : b), null);
  const idxAt = t => { let lo = 0, hi = L.length - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (L[m].t < t) lo = m + 1; else hi = m; } return lo; };

  // ---------- setup ----------
  const AMTS = { lump: [100000, 500000, 1000000, 2500000], sip: [5000, 10000, 25000, 50000] };
  const cfg = { mode: "lump", amt: { lump: 1000000, sip: 10000 } };
  $("lede").innerHTML = `We'll put your money into <b>${D.name}</b> at the worst moment in its history: the very top, right before its deepest fall.
    You won't know when that was. You'll live through it month by month, next to what the same money would have earned sitting in cash.
    The <b>Sell</b> button is always there.`;
  // a line that hides where it goes next
  $("mystery").innerHTML = `<svg viewBox="0 0 400 230" preserveAspectRatio="none">
    <defs><linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#F6F8FA" stop-opacity="0"/><stop offset=".25" stop-color="#F6F8FA"/></linearGradient></defs>
    <line x1="20" x2="380" y1="70" y2="70" stroke="#CBD3DC" stroke-dasharray="4 5"/>
    <path d="M20,150 C70,140 90,90 130,74 S175,66 190,70" fill="none" stroke="#1F4E79" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="190" cy="70" r="4.5" fill="#1F4E79"><animate attributeName="r" values="4.5;7;4.5" dur="1.6s" repeatCount="indefinite"/></circle>
    <rect x="200" y="20" width="185" height="195" fill="url(#fade)"/>
    <text x="290" y="128" text-anchor="middle" font-size="40" font-weight="700" fill="#D5DCE3" font-family="Inter, sans-serif">?</text>
    <text x="290" y="160" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#8A939E" font-family="Inter, sans-serif" font-weight="600">WHAT COMES NEXT</text></svg>`;
  function renderSetup() {
    document.querySelectorAll("#mode button").forEach(b => b.classList.toggle("on", b.dataset.m === cfg.mode));
    $("amts").innerHTML = AMTS[cfg.mode].map(a => `<button data-a="${a}" class="${a === cfg.amt[cfg.mode] ? "on" : ""}">
      ${cfg.mode === "sip" ? short(a) + " / month" : short(a)}</button>`).join("");
    $("amts").querySelectorAll("button").forEach(b => b.addEventListener("click", () => { cfg.amt[cfg.mode] = +b.dataset.a; renderSetup(); }));
  }
  document.querySelectorAll("#mode button").forEach(b => b.addEventListener("click", () => { cfg.mode = b.dataset.m; renderSetup(); }));
  renderSetup();
  if (!worst) { $("go").disabled = true; $("lede").innerHTML += `<br><br>This one has never fallen 15% or more, so there's nothing to handle. Try something bumpier.`; }

  // ---------- simulation ----------
  let G = null;
  function simulate() {
    const a = idxAt(Date.parse(worst.peak)), n = L.length - a, amt = cfg.amt[cfg.mode], sip = cfg.mode === "sip";
    const rows = [], flows = []; let units = 0, inv = 0, cu = 0, lastMonth = -1;
    for (let i = 0; i < n; i++) {
      const p = L[a + i], dt = new Date(p.t), m = dt.getUTCFullYear() * 12 + dt.getUTCMonth();
      let put = 0;
      if (i === 0 && !sip) put = amt;
      if (sip && m !== lastMonth) put = amt;
      lastMonth = m;
      if (put) { units += put / p.v; cu += put / CASH[a + i]; inv += put; flows.push({ t: p.t, a: -put, i }); }
      rows.push({ t: p.t, inv, val: units * p.v, cash: cu * CASH[a + i], put });
    }
    // the cash rate when you started, annualised from the first month
    const j = Math.min(a + 4, L.length - 1);
    const rate0 = (CASH[j] / CASH[a] - 1) * YR / Math.max(DAY, L[j].t - L[a].t) * 100;   // quoted (simple) rate, like 7.75%
    return { a, n, rows, flows, amt, sip, rate0 };
  }

  function start() {
    if (!worst) return;
    G = simulate();
    Object.assign(G, { xEnd: null, ymin: null, ymax: null, pos: 0, speed: 1, paused: false, sold: null, done: false, maxPain: 0,
      underStart: null, longestUnder: 0, fired: new Set(), lastShake: 0, peakBpm: 72, underSips: 0, sipCount: 0 });
    document.querySelectorAll("#speed button").forEach(b => b.classList.toggle("on", b.dataset.s === "1"));
    $("thoughts").innerHTML = "";
    $("p-name").textContent = `${D.name} · ${G.sip ? short(G.amt) + " a month" : short(G.amt) + " lump sum"} · cash is earning ${G.rate0.toFixed(1)}% a year`;
    $("l-val").textContent = "Your money now";
    $("sell").disabled = false; $("sell").innerHTML = `I can't handle it. Sell. <span class="kbd">S</span>`;
    show("play"); sizeCanvas(); setPause(false);
    think(G.sip ? `First SIP of ${short(G.amt)} goes in. The market is at an all-time high.` : `${short(G.amt)} invested. The market is at an all-time high. What could go wrong?`);
    last = performance.now(); requestAnimationFrame(tick);
  }

  // ---------- canvas ----------
  const cv = $("cv"), ctx = cv.getContext("2d"); let W = 0, H = 0;
  function sizeCanvas() {
    const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", () => { if (G) sizeCanvas(); });
  const myVal = i => G.sold && i >= G.sold.i ? G.sold.val : G.rows[i].val;
  const myInv = i => G.sold && i >= G.sold.i ? G.sold.inv : G.rows[i].inv;
  const niceStep = raw => { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))), m = raw / p; return (m < 1.5 ? 1 : m < 3 ? 2 : m < 7 ? 5 : 10) * p; };

  function draw(posF) {
    const R = G.rows, n = R.length, k = Math.floor(posF), frac = posF - k;
    const pl = 6, pr = 62, pt = 12, pb = 24, cw = W - pl - pr, ch = H - pt - pb;
    let lo = Infinity, hi = -Infinity;
    for (let i = 0; i <= k; i++) { const r = R[i]; lo = Math.min(lo, r.val, r.inv, r.cash, myVal(i)); hi = Math.max(hi, r.val, r.inv, r.cash, myVal(i)); }
    lo = Math.max(0, lo * 0.9); hi = hi * 1.06;
    G.ymin = G.ymin == null ? lo : G.ymin + (lo - G.ymin) * 0.08; G.ymax = G.ymax == null ? hi : G.ymax + (hi - G.ymax) * 0.08;
    // the window grows with time, so the fall fills the chart
    const t0 = R[0].t, tNow = R[k].t;
    const want = Math.min(R[n - 1].t, Math.max(t0 + 3.5 * YR, tNow + 1.1 * YR));
    G.xEnd = G.xEnd == null ? want : G.xEnd + (want - G.xEnd) * 0.06;
    const t1 = Math.max(G.xEnd, tNow + DAY);
    const X = t => pl + (t - t0) / (t1 - t0) * cw, Y = v => pt + (1 - (v - G.ymin) / (G.ymax - G.ymin || 1)) * ch;
    ctx.clearRect(0, 0, W, H);
    ctx.font = "11px Inter, system-ui, sans-serif";
    const step = niceStep((G.ymax - G.ymin) / 4);
    ctx.textAlign = "left";
    for (let v = Math.ceil(G.ymin / step) * step; v <= G.ymax; v += step) {
      const y = Y(v); ctx.strokeStyle = "#EEF1F4"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(pl, y); ctx.lineTo(W - pr, y); ctx.stroke();
      ctx.fillStyle = "#8A939E"; ctx.fillText(short(v), W - pr + 8, y + 4);
    }
    const yearsSpan = (t1 - t0) / YR, every = Math.max(1, Math.ceil(yearsSpan / 8));
    ctx.textAlign = "center"; ctx.fillStyle = "#A3ABB5";
    for (let y = every; y <= yearsSpan; y += every) { const x = X(t0 + y * YR); ctx.fillText(`Yr ${y}`, x, H - 7);
      ctx.strokeStyle = "#F3F5F7"; ctx.beginPath(); ctx.moveTo(x, pt); ctx.lineTo(x, H - pb); ctx.stroke(); }
    const xnow = k < n - 1 ? X(R[k].t + (R[k + 1].t - R[k].t) * frac) : X(R[k].t);
    const head = get => k < n - 1 ? get(k) + (get(k + 1) - get(k)) * frac : get(k);
    // the gap between your money and what you put in: red below, green above
    for (let j = 1; j <= k + (k < n - 1 ? 1 : 0); j++) {
      const i0 = j - 1, i1 = j <= k ? j : null;
      const xa = X(R[i0].t), xb = i1 != null ? X(R[i1].t) : xnow;
      const va = myVal(i0), vb = i1 != null ? myVal(i1) : head(myVal), ia = myInv(i0), ib = i1 != null ? myInv(i1) : head(myInv);
      ctx.fillStyle = (va + vb) / 2 < (ia + ib) / 2 ? "rgba(210,63,74,.22)" : "rgba(46,139,87,.14)";
      ctx.beginPath(); ctx.moveTo(xa, Y(va)); ctx.lineTo(xb, Y(vb)); ctx.lineTo(xb, Y(ib)); ctx.lineTo(xa, Y(ia)); ctx.closePath(); ctx.fill();
    }
    const line = (get, color, w, dash) => {
      ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.setLineDash(dash || []); ctx.lineJoin = "round"; ctx.beginPath();
      let on = false;
      for (let i = 0; i <= k; i++) { const v = get(i); if (v == null) { on = false; continue; } const x = X(R[i].t), y = Y(v); if (on) ctx.lineTo(x, y); else ctx.moveTo(x, y); on = true; }
      if (k < n - 1 && get(k) != null && get(k + 1) != null) ctx.lineTo(xnow, Y(head(get)));
      ctx.stroke(); ctx.restore();
    };
    line(i => R[i].cash, "#C08A2E", 2);
    line(myInv, "#9AA6B2", 1.4, [5, 4]);
    if (G.sold) line(i => (i >= G.sold.i ? R[i].val : null), "rgba(46,139,87,.8)", 1.8, [6, 4]);
    line(myVal, "#1F4E79", 2.6);
    const hv = head(myVal), hy = Y(hv), under = hv < head(myInv), col = under ? "#D23F4A" : "#2E8B57";
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(xnow, hy, 4.5, 0, Math.PI * 2); ctx.fill();
    const ring = (performance.now() % 1400) / 1400;
    ctx.strokeStyle = under ? `rgba(210,63,74,${.5 * (1 - ring)})` : `rgba(46,139,87,${.5 * (1 - ring)})`; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(xnow, hy, 4.5 + ring * 14, 0, Math.PI * 2); ctx.stroke();
    // cash, labelled at its tip so the gap is obvious
    const cy = Y(head(i => R[i].cash));
    ctx.fillStyle = "#C08A2E"; ctx.beginPath(); ctx.arc(xnow, cy, 3, 0, Math.PI * 2); ctx.fill();
    ctx.font = "600 11px Inter, system-ui"; ctx.textAlign = "left"; ctx.fillText("Cash", Math.min(xnow + 7, W - pr - 30), cy - 6);
    if (G.sold) { const sx = X(R[G.sold.i].t), sy = Y(G.sold.val); ctx.fillStyle = "#D23F4A"; ctx.beginPath(); ctx.arc(sx, sy, 4.5, 0, Math.PI * 2); ctx.fill();
      ctx.textAlign = "center"; ctx.fillText("You sold", sx, sy - 11); }
  }

  // ---------- thoughts ----------
  function think(text, cls = "") {
    const box = $("thoughts"), el = document.createElement("div");
    el.className = "thought " + cls; el.innerHTML = text; box.prepend(el);
    while (box.children.length > 3) box.lastChild.remove();
    setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 500); }, 4200 / Math.sqrt(G ? G.speed : 1));
  }
  const once = (key, fn) => { if (!G.fired.has(key)) { G.fired.add(key); fn(); } };

  // ---------- loop ----------
  let last = 0;
  const WEEKS_PER_SEC = 2.4;
  function tick(now) {
    if (!G || G.done) return;
    const dt = clamp((now - last) / 1000, 0, .1); last = Math.max(last, now);
    const n = G.rows.length;
    if (!G.paused) {
      const k = Math.floor(G.pos), drag = myVal(k) / myInv(k) - 1 < -0.25 ? 0.75 : 1;
      G.pos = Math.min(n - 1, G.pos + dt * WEEKS_PER_SEC * G.speed * drag);
      for (let i = k + 1; i <= Math.floor(G.pos); i++) step(i);
    }
    draw(G.pos); hud(Math.floor(G.pos));
    if (G.pos >= n - 1) { G.done = true; setTimeout(finish, 900); return; }
    requestAnimationFrame(tick);
  }

  function step(i) {
    const r = G.rows[i], val = myVal(i), inv = myInv(i), pnl = val / inv - 1;
    if (!G.sold) {
      if (pnl < G.maxPain) { G.maxPain = pnl;
        if (pnl < -0.2 && performance.now() - G.lastShake > 2500) { G.lastShake = performance.now(); const st = $("stage");
          st.classList.remove("shake"); void st.offsetWidth; st.classList.add("shake"); } }
      if (pnl < 0) { if (G.underStart == null) G.underStart = r.t; G.longestUnder = Math.max(G.longestUnder, r.t - G.underStart); if (r.put) G.underSips++; }
      else if (G.underStart != null) { const took = r.t - G.underStart;
        if (took > 120 * DAY) once("back" + G.underStart, () => think(`Back above water. That took <b>${dur(took)}</b>.`, "good"));
        G.underStart = null; }
      const lost = inv - val, behindCash = r.cash - val;
      if (pnl <= -0.10) once("p10", () => think(`Down 10%. Just a correction. Probably.`, "bad"));
      if (pnl <= -0.20) once("p20", () => think(`Down 20%. The news is calling it a bear market.`, "bad"));
      if (pnl <= -0.30) once("p30", () => think(`<b>${short(lost)}</b> gone. It's only on paper, but it doesn't feel like paper.`, "bad"));
      if (pnl <= -0.40) once("p40", () => think(`Down 40%. Every instinct is telling you to get out.`, "bad"));
      if (pnl <= -0.50) once("p50", () => think(`Half of it, gone. This is where most people sell.`, "bad"));
      if (pnl <= -0.60) once("p60", () => think(`Down 60%. From here it needs to rise 150% just to get back to zero.`, "bad"));
      if (behindCash / inv > 0.3) once("cash30", () => think(`If you'd left it in cash, you'd have <b>${short(behindCash)} more</b> right now.`, "bad"));
      if (G.underStart != null) {
        const u = r.t - G.underStart;
        [[0.5, `Six months in, and still down ${pct(pnl * 100, 0)}.`], [1, `A full year underwater. Cash is ${short(r.cash - val)} ahead of you.`],
         [2, `Two years, and you're still in the red.`], [3, `Three years, still negative. Still holding?`],
         [4, `Four years underwater. People have stopped asking about your investments.`], [5, `Five years. Most people have given up by now.`]]
          .forEach(([y, txt]) => { if (u >= y * YR) once("u" + y + "_" + G.underStart, () => think(txt, "bad")); });
        if (G.sip && r.put && pnl < -0.05) { G.sipCount++;
          if (G.sipCount % 6 === 3) think(`Another ${short(G.amt)} SIP goes in. You're still down ${pct(pnl * 100, 0)}. Keep paying?`, "bad"); }
      }
      if (val > r.cash && G.maxPain < -0.2) once("passcash", () => think(`You've just pulled ahead of cash again.`, "good"));
      if (pnl >= 0.5 && G.maxPain < -0.2) once("g50", () => think(`Up 50%. Remember wanting to sell at ${pct(G.maxPain * 100, 0)}?`, "good"));
      if (pnl >= 1.0) once("g100", () => think(`Your money has doubled.`, "good"));
    } else {
      if (r.val >= r.inv && G.sold.pnl < 0) once("missback", () => think(`It's back above what you put in. You'd be in profit now.`, "bad"));
      if (r.val > G.rows[G.sold.i].val * 1.5) once("miss50", () => think(`Up 50% since you sold. You're watching from the outside.`, "bad"));
    }
  }

  function hud(i) {
    const r = G.rows[i], val = myVal(i), inv = myInv(i), pnl = val / inv - 1;
    $("p-date").textContent = elapsedLabel(r.t - G.rows[0].t);
    const vb = $("v-val"); vb.textContent = inr(val); vb.className = "num " + (pnl < -0.001 ? "neg" : pnl > 0.001 ? "pos" : "");
    $("v-inv").textContent = inr(inv);
    const ab = $("v-abs"); ab.textContent = pct(pnl * 100); ab.className = "num " + (pnl < 0 ? "neg" : "pos");
    const fl = G.flows.filter(f => f.i <= (G.sold ? G.sold.i : i));
    const tEnd = G.sold ? G.rows[G.sold.i].t : r.t, x = yearly(fl, tEnd, val);
    const xb = $("v-xirr");
    if (x == null) { xb.textContent = tEnd - G.rows[0].t < YR ? "after 1 yr" : "—"; xb.className = "num wait"; }
    else { xb.textContent = pct(x); xb.className = "num " + (x < 0 ? "neg" : "pos"); }
    // you versus the same money left in cash
    const diff = val - r.cash;
    const cb = $("v-cash"); cb.textContent = (diff >= 0 ? "+" : "") + short(diff); cb.className = "num " + (diff < 0 ? "neg" : "pos");
    $("v-cash2").textContent = `Cash: ${short(r.cash)}`;
    const u = G.sold ? 0 : (G.underStart != null ? r.t - G.underStart : 0);
    $("v-under").textContent = u ? dur(u) : "—";
    const pain = G.sold ? 0 : clamp(-pnl / 0.5, 0, 1);
    document.documentElement.style.setProperty("--pain", pain.toFixed(3));
    const bpm = Math.round(68 + pain * 92 + (G.underStart != null ? Math.min(20, (r.t - G.underStart) / YR * 5) : 0));
    G.peakBpm = Math.max(G.peakBpm, bpm);
    $("bpm").textContent = bpm; $("heart").style.setProperty("--beat", (60 / bpm).toFixed(2) + "s");
    $("sell").classList.toggle("urge", !G.sold && pnl < -0.3);
    $("status").innerHTML = G.sold
      ? `You sold at <b>${pct(G.sold.pnl * 100, 0)}</b>, ${dur(G.sold.t - G.rows[0].t)} in. The green dashes show what you'd have if you'd stayed.`
      : pnl < -0.3 ? `Deepest so far: <b>${pct(G.maxPain * 100, 0)}</b>. Nobody would blame you.`
      : pnl < 0 ? `You're down, but you're still in.` : `You're ahead. For now.`;
  }

  function sell() {
    if (!G || G.sold || G.done) return;
    const i = Math.floor(G.pos), r = G.rows[i];
    G.sold = { i, val: r.val, inv: r.inv, pnl: r.val / r.inv - 1, t: r.t };
    $("sell").disabled = true; $("sell").textContent = "Sold";
    $("l-val").textContent = "Your money (sold)";
    think(`Sold. ${inr(r.val)} is safe. Let's see what happens next.`);
  }
  function setPause(p) { if (!G) return; G.paused = p;
    $("pause-ico").innerHTML = p ? `<path d="M4 2.5v11l9-5.5z"/>` : `<rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/>`; }
  function skip() {
    if (!G || G.done) return;
    for (let i = Math.floor(G.pos) + 1; i < G.rows.length; i++) { if (G.sold) break; const r = G.rows[i], pnl = r.val / r.inv - 1;
      if (pnl < G.maxPain) G.maxPain = pnl;
      if (pnl < 0) { if (G.underStart == null) G.underStart = r.t; G.longestUnder = Math.max(G.longestUnder, r.t - G.underStart); if (r.put) G.underSips++; }
      else G.underStart = null; }
    G.pos = G.rows.length - 1;
  }

  // ---------- end ----------
  function crisisName(t) {           // the storm this peak led into
    const c = CRISES.find(c => c.long && t >= c.a - 75 * DAY && t <= c.b); return c ? c.long : null;
  }
  function finish() {
    const R = G.rows, n = R.length, endR = R[n - 1];
    const stay = { val: endR.val, inv: endR.inv, x: yearly(G.flows, endR.t, endR.val) };
    const mine = G.sold ? { val: G.sold.val, inv: G.sold.inv, x: yearly(G.flows.filter(f => f.i <= G.sold.i), G.sold.t, G.sold.val),
                            short: G.sold.t - R[0].t < YR } : stay;
    const cash = { val: endR.cash, x: yearly(G.flows, endR.t, endR.cash) };
    const name = crisisName(R[0].t);
    $("e-eyebrow").textContent = `${D.name}${name ? " · this was " + name : ""}`;
    // the real period, and every storm along the way
    const soldT = G.sold ? G.sold.t : null;
    $("period").innerHTML = `<b>${monthName(R[0].t)} → ${monthName(endR.t)}</b><span>${dur(endR.t - R[0].t)}, starting at the peak</span>`;
    const storms = CRISES.filter(c => c.b >= R[0].t - 75 * DAY && c.a <= endR.t);
    const tick = `<svg viewBox="0 0 12 12"><path d="M2.5 6.5l2.3 2.3L9.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    G.survived = storms.filter(c => !soldT || c.b < soldT);
    $("storms").innerHTML = storms.map((c, i) => {
      const yr = new Date(c.a).getUTCFullYear(), during = soldT && soldT >= c.a && soldT <= c.b + 31 * DAY, after = soldT && c.a > soldT;
      const cls = during ? "sold" : after ? "missed" : "";
      const tag = during ? "you sold here" : after ? "after you sold" : "survived";
      return `<span class="storm ${cls}" style="animation-delay:${150 + i * 60}ms">${!cls ? tick : ""}${c.n} <i>${yr} · ${tag}</i></span>`;
    }).join("");
    const stillUnder = endR.val < endR.inv;
    let h, p;
    if (!G.sold) {
      if (stillUnder) { h = "You're still underwater. And still holding.";
        p = `This fall hasn't finished yet: you're at ${pct((endR.val / endR.inv - 1) * 100, 0)} today, ${dur(G.longestUnder)} after it started.
          That's the hardest place to be, and where patience is actually tested. You didn't press the button.`; }
      else { h = G.maxPain <= -0.3 || G.longestUnder >= YR ? "You handled it." : "You handled it. This time it was gentle.";
        const sv = G.survived.map(c => c.n.replace(/^(.)/, m => m.toLowerCase()).replace("covid", "Covid").replace("iL&FS", "IL&FS").replace("euro", "euro"));
        const list = sv.length > 3 ? `the ${sv[0]}, the ${sv[1]} and ${sv.length - 2} more` : sv.length ? sv.map(x => "the " + x).join(sv.length === 2 ? " and " : ", ") : "";
        p = `${list ? `You survived ${list}. ` : ""}You sat through a fall of <b>${pct(G.maxPain * 100, 0)}</b> and <b>${dur(G.longestUnder)}</b> underwater without selling.
          ${G.sip && G.underSips ? `<b>${G.underSips}</b> of your SIP instalments went in while you were down; those bought the cheapest units of the whole ride. ` : ""}
          Your ${short(stay.inv)} became <b>${short(stay.val)}</b>${stay.x != null ? `, ${pct(stay.x)} a year` : ""}.`; }
    } else {
      const better = stay.val > mine.val, d = Math.abs(stay.val - mine.val);
      h = `You blinked at ${pct(G.sold.pnl * 100, 0)}.`;
      p = better
        ? `You sold in ${monthName(G.sold.t)}, ${dur(G.sold.t - R[0].t)} in, and then sat out the recovery. Holding on would have turned your ${short(stay.inv)} into <b>${short(stay.val)}</b>${stay.x != null ? ` (${pct(stay.x)} a year)` : ""}.
           Selling locked in ${short(mine.val)}, <b>${short(d)} less</b>. The fall was temporary. The exit made it permanent.`
        : `This time selling saved you ${short(d)}: it's still lower today. But you'd also have had to know when to get back in, and almost nobody does.`;
    }
    $("e-h").textContent = h; $("e-p").innerHTML = p;
    const tiles = [["Deepest fall you felt", pct(G.maxPain * 100, 0), "neg"], ["Longest stretch underwater", G.longestUnder ? dur(G.longestUnder) : "None", ""],
      ["Highest pulse", G.peakBpm + " bpm", ""], [G.sip ? "SIPs paid while down" : "Cash rate when you started", G.sip ? String(G.underSips) : G.rate0.toFixed(1) + "% a year", ""]];
    $("pain").innerHTML = tiles.map(([l, v, c]) => `<div class="n"><label>${l}</label><b class="num ${c}">${v}</b></div>`).join("");
    const rows = [];
    if (G.sold) rows.push({ t: "You (sold)", v: mine.val, x: mine.x, cls: "me", note: mine.short ? `${pct((mine.val / mine.inv - 1) * 100)} in ${dur(G.sold.t - R[0].t)}` : null }, { t: "If you'd stayed invested", v: stay.val, x: stay.x, cls: "stay" });
    else rows.push({ t: "You (stayed invested)", v: stay.val, x: stay.x, cls: "me" });
    rows.push({ t: "The same money in cash", v: cash.val, x: cash.x, cls: "cash" }, { t: "What you put in", v: stay.inv, x: null });
    const top = Math.max(...rows.map(r => r.v));
    $("cmp").innerHTML = rows.map((r, i) => `<div class="crow ${r.cls || ""}" style="animation-delay:${200 + i * 90}ms">
      <div><div class="t">${r.t}</div><div class="bar"><i data-w="${r.v / top * 100}"></i></div></div>
      <div class="v num">${short(r.v)}${r.x != null ? `<small>${pct(r.x)} a year</small>` : r.note ? `<small>${r.note}</small>` : ""}</div></div>`).join("");
    setTimeout(() => document.querySelectorAll("#cmp .bar i").forEach(b => b.style.width = b.dataset.w + "%"), 350);
    // the line the whole game is about: staying invested versus cash
    const ic = stay.val - cash.val;
    $("gap").innerHTML = ic >= 0
      ? `Staying invested beat cash by <b>${short(ic)}</b>. Cash started at ${G.rate0.toFixed(1)}% a year and never had a bad month, and it still ended up behind.`
      : `So far, cash is ahead by <b>${short(-ic)}</b>. That happens when you start at a peak and the clock stops early; the longer you stay, the more that tends to flip.`;
    $("other").textContent = G.sip ? "Try it as a lump sum" : "Try it as a monthly SIP";
    $("foot").innerHTML = `${D.kind === "fund" ? "NAV from mfapi.in" : "Total return index levels from NSE Indices via FinAPI"}, weekly, to ${D.asOf}.
      Cash earns the overnight rate of the time: RBI's repo rate until 2010, then the Nifty 1D Rate index. SIPs go in on the first trading week of each month.
      XIRR is the annualised return on your actual cash flows. Before tax.`;
    document.documentElement.style.setProperty("--pain", "0");
    show("end"); requestAnimationFrame(drawEnd);
  }
  function drawEnd() {
    const c = $("cv2"), x = c.getContext("2d"), r = c.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.width = r.width * dpr; c.height = r.height * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
    const R = G.rows, n = R.length, Wd = r.width, Hd = r.height, pad = 6;
    const tf = G.sip ? (v => v) : (v => Math.log(Math.max(v, 1)));     // log for a lump sum, so the fall reads at full size
    const vals = R.flatMap((q, i) => [q.val, q.inv, q.cash, myVal(i)]).map(tf);
    const lo0 = Math.min(...vals), hi0 = Math.max(...vals), pv = (hi0 - lo0) * .05, lo = lo0 - pv, hi = hi0 + pv;
    const X = i => pad + i / (n - 1) * (Wd - pad * 2), Y = v => pad + (1 - (tf(v) - lo) / (hi - lo)) * (Hd - pad * 2);
    // storms as faint bands, so the chart and the list above tell the same story
    const iAt = t => { let k = 0; while (k < n - 1 && R[k].t < t) k++; return k; };
    x.font = "600 10px Inter, system-ui"; x.textAlign = "center";
    CRISES.filter(c => c.b >= R[0].t && c.a <= R[n - 1].t).forEach(c => {
      const xa = X(iAt(c.a)), xb = Math.max(X(iAt(c.b)), xa + 3);
      x.fillStyle = "rgba(27,37,51,.05)"; x.fillRect(xa, pad, xb - xa, Hd - pad * 2);
      if (xb - xa > x.measureText(c.tag).width + 4) { x.fillStyle = "#8A939E"; x.fillText(c.tag, (xa + xb) / 2, Hd - 4); }
    });
    for (let i = 1; i < n; i++) { x.fillStyle = R[i].val < R[i].inv ? "rgba(210,63,74,.2)" : "rgba(46,139,87,.12)";
      x.beginPath(); x.moveTo(X(i - 1), Y(R[i - 1].val)); x.lineTo(X(i), Y(R[i].val)); x.lineTo(X(i), Y(R[i].inv)); x.lineTo(X(i - 1), Y(R[i - 1].inv)); x.fill(); }
    const path = (get, col, w, dash) => { x.strokeStyle = col; x.lineWidth = w; x.setLineDash(dash || []); x.beginPath();
      R.forEach((q, i) => { const v = get(i); if (i) x.lineTo(X(i), Y(v)); else x.moveTo(X(i), Y(v)); }); x.stroke(); x.setLineDash([]); };
    path(i => R[i].inv, "#9AA6B2", 1.2, [5, 4]);
    path(i => R[i].cash, "#C08A2E", 1.8);
    path(i => R[i].val, G.sold ? "rgba(46,139,87,.85)" : "#1F4E79", 2.2, G.sold ? [6, 4] : null);
    if (G.sold) { path(i => myVal(i), "#1F4E79", 2.2); x.fillStyle = "#D23F4A"; x.beginPath(); x.arc(X(G.sold.i), Y(G.sold.val), 4.5, 0, Math.PI * 2); x.fill(); }
  }

  // test hook: lets automated checks rebuild a run without playing it
  window.__handleIt = { simulate, xirr, yearly, cfg, worst: () => worst };

  // ---------- plumbing ----------
  function show(id) { ["setup", "play", "end"].forEach(s => $(s).classList.toggle("on", s === id)); }
  $("go").addEventListener("click", start);
  $("sell").addEventListener("click", sell);
  $("pause").addEventListener("click", () => setPause(!G.paused));
  $("skip").addEventListener("click", skip);
  document.querySelectorAll("#speed button").forEach(b => b.addEventListener("click", () => { G.speed = +b.dataset.s;
    document.querySelectorAll("#speed button").forEach(x => x.classList.toggle("on", x === b)); }));
  $("again").addEventListener("click", () => { G = null; renderSetup(); show("setup"); });
  $("other").addEventListener("click", () => { cfg.mode = G.sip ? "lump" : "sip"; renderSetup(); start(); });
  document.addEventListener("keydown", e => {
    const on = id => $(id).classList.contains("on");
    if (on("setup") && e.key === "Enter") start();
    else if (on("play")) { if (e.key === " ") { e.preventDefault(); setPause(!G.paused); } if (e.key === "s" || e.key === "S") sell(); }
    else if (on("end") && e.key === "Enter") $("again").click();
  });
})();
</script>
</body>
