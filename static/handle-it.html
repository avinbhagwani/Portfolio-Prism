<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Inter; src: url("/app/static/fonts/Inter-Regular.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: Inter; src: url("/app/static/fonts/Inter-Medium.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: Inter; src: url("/app/static/fonts/Inter-SemiBold.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: Inter; src: url("/app/static/fonts/Inter-Bold.woff2") format("woff2"); font-weight: 700; }
:root {
  --bg: #0D1726; --bg2: #13213A; --ink: #EEF2F7; --ink2: #B3C0D0; --muted: #7D8DA3; --line: rgba(255,255,255,.08);
  --red: #F0525F; --red2: #B3202E; --green: #3FCF8E; --gold: #E3B45E; --blue: #8FB4E8;
  --pain: 0; --gain: 0; --ease: cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: transparent; color: var(--ink);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
body { padding: 4px 4px 14px 4px; }
button { font: inherit; cursor: pointer; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

.stage { position: relative; border-radius: 22px; overflow: hidden; background: var(--bg);
  box-shadow: 0 2px 4px rgba(10,20,40,.10), 0 24px 56px rgba(10,20,40,.25); isolation: isolate; }
/* the room turns red as the pain grows, green as it heals */
.stage::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(120% 90% at 50% 120%, rgba(200,30,45, calc(var(--pain) * .55)) 0%, transparent 60%),
    radial-gradient(90% 70% at 0% 0%, rgba(200,30,45, calc(var(--pain) * .35)) 0%, transparent 60%),
    radial-gradient(90% 70% at 100% 0%, rgba(200,30,45, calc(var(--pain) * .35)) 0%, transparent 60%),
    radial-gradient(110% 80% at 50% 115%, rgba(40,190,120, calc(var(--gain) * .30)) 0%, transparent 60%),
    linear-gradient(170deg, #12203A 0%, #0B1424 70%); transition: background .3s linear; }
.stage::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  box-shadow: inset 0 0 calc(40px + var(--pain) * 120px) rgba(150, 10, 25, calc(var(--pain) * .7)); }
.stage.shake { animation: shake .45s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake { 10%,90% { transform: translateX(-1px); } 20%,80% { transform: translateX(2px); }
  30%,50%,70% { transform: translateX(-3px); } 40%,60% { transform: translateX(3px); } }

.screen { display: none; padding: 30px 34px 28px 34px; }
.screen.on { display: block; animation: rise .6s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.eyebrow { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.btn { border: 0; background: var(--ink); color: #0D1726; border-radius: 999px; padding: 12px 22px; font-weight: 600; font-size: 15px;
  display: inline-flex; align-items: center; gap: 8px; transition: transform .15s ease, box-shadow .2s ease; }
.btn:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(0,0,0,.35); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); }
.btn.ghost:hover { box-shadow: inset 0 0 0 1px rgba(255,255,255,.45); }
.kbd { font-size: 11px; border: 1px solid currentColor; border-radius: 5px; padding: 0 5px; opacity: .55; font-weight: 500; }
.seg { display: inline-flex; background: rgba(255,255,255,.06); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font-size: 13.5px; color: var(--ink2); font-weight: 500;
  transition: background .2s ease, color .2s ease; }
.seg button.on { background: var(--ink); color: #0D1726; }

/* ---------- setup ---------- */
.s-title { font-size: 44px; font-weight: 700; letter-spacing: -.03em; line-height: 1.04; margin: 8px 0 12px 0; }
.s-title em { font-style: normal; color: var(--red); }
.s-lede { font-size: 16px; line-height: 1.6; color: var(--ink2); max-width: 40rem; margin: 0 0 24px 0; }
.s-lede b { color: var(--ink); font-weight: 600; }
.lbl { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 10px 0; }
.scen { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 24px; }
.sc { text-align: left; border: 0; background: rgba(255,255,255,.04); border-radius: 14px; padding: 12px 14px 12px 14px;
  box-shadow: inset 0 0 0 1px var(--line); transition: background .2s ease, box-shadow .2s ease, transform .2s var(--ease); }
.sc:hover { background: rgba(255,255,255,.07); transform: translateY(-2px); }
.sc.on { background: rgba(240,82,95,.10); box-shadow: inset 0 0 0 1.5px var(--red); }
.sc svg { display: block; width: 100%; height: 46px; margin-bottom: 8px; }
.sc b { display: block; font-size: 15px; font-weight: 600; }
.sc .fell { color: var(--red); font-weight: 600; font-size: 13.5px; }
.sc small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
.row { display: flex; gap: 34px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 26px; }
.amts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.amts button { border: 0; background: rgba(255,255,255,.06); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; color: var(--ink2);
  font-weight: 500; transition: background .2s, color .2s; }
.amts button.on { background: rgba(227,180,94,.16); color: var(--gold); box-shadow: inset 0 0 0 1px rgba(227,180,94,.5); }
.go-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.warn { font-size: 13px; color: var(--muted); }

/* ---------- play ---------- */
.p-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.p-name { font-size: 14px; color: var(--ink2); font-weight: 500; }
.p-date { font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; }
.p-date small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.ctl { display: flex; align-items: center; gap: 10px; }
.icon { width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255,255,255,.08); display: grid; place-items: center;
  transition: background .2s; }
.icon:hover { background: rgba(255,255,255,.16); }
.icon svg { width: 16px; height: 16px; fill: var(--ink); }
.pulse { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 10px; border-radius: 999px; background: rgba(255,255,255,.06);
  font-size: 13px; color: var(--ink2); }
.heart { width: 16px; height: 16px; fill: var(--red); transform-origin: center; }
.heart.beat { animation: beat var(--beat, 1s) infinite; }
@keyframes beat { 0%,100% { transform: scale(1); } 12% { transform: scale(1.28); } 24% { transform: scale(1); } 36% { transform: scale(1.18); } 50% { transform: scale(1); } }

.nums { display: grid; grid-template-columns: 1.5fr repeat(4, 1fr); gap: 10px; margin: 18px 0 14px 0; }
.n { background: rgba(255,255,255,.04); border-radius: 14px; padding: 10px 14px 11px 14px; box-shadow: inset 0 0 0 1px var(--line); }
.n label { display: block; font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.n b { font-size: 21px; font-weight: 700; letter-spacing: -.01em; transition: color .3s ease; }
.n.hero b { font-size: 30px; }
.neg { color: var(--red); } .pos { color: var(--green); }

.chartwrap { position: relative; height: 330px; margin: 0 -6px; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 6px 0 0 0; }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; vertical-align: 3px; margin-right: 6px; }

.thoughts { position: absolute; right: 78px; top: 14px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: none; max-width: 58%; }
.thought { background: rgba(8,14,26,.82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-radius: 12px; padding: 9px 14px;
  font-size: 14px; line-height: 1.4; color: var(--ink); box-shadow: 0 8px 26px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.08);
  animation: tin .45s var(--ease) both; }
.thought.event { border-left: 3px solid var(--gold); }
.thought.bad { border-left: 3px solid var(--red); }
.thought.good { border-left: 3px solid var(--green); }
.thought small { display: block; font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-weight: 600; margin-bottom: 2px; }
.thought.out { animation: tout .5s ease both; }
@keyframes tin { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes tout { to { opacity: 0; transform: translateY(-6px); } }

.p-bottom { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 16px; flex-wrap: wrap; }
.status { font-size: 14px; color: var(--ink2); max-width: 36rem; line-height: 1.5; }
.status b { color: var(--ink); }
.sell { border: 0; border-radius: 999px; padding: 14px 24px; font-size: 15.5px; font-weight: 700; color: #fff; background: var(--red2);
  box-shadow: 0 0 0 0 rgba(240,82,95,.0), 0 10px 24px rgba(179,32,46,.35); transition: transform .15s ease, background .2s ease; }
.sell:hover { transform: translateY(-1px); background: #C92636; }
.sell.urge { animation: urge 1.6s ease-in-out infinite; }
@keyframes urge { 0%,100% { box-shadow: 0 0 0 0 rgba(240,82,95,.45), 0 10px 24px rgba(179,32,46,.35); }
  50% { box-shadow: 0 0 0 12px rgba(240,82,95,0), 0 10px 24px rgba(179,32,46,.35); } }
.sell[disabled] { background: rgba(255,255,255,.08); color: var(--muted); box-shadow: none; animation: none; cursor: default; }

/* ---------- end ---------- */
.e-h { font-size: 40px; font-weight: 700; letter-spacing: -.03em; line-height: 1.06; margin: 8px 0 12px 0; }
.e-p { font-size: 16px; line-height: 1.62; color: var(--ink2); max-width: 46rem; margin: 0 0 22px 0; }
.e-p b { color: var(--ink); }
.e-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 26px; align-items: start; }
.pain { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.cmp { display: flex; flex-direction: column; gap: 9px; }
.crow { display: grid; grid-template-columns: 1fr 110px; gap: 10px; align-items: center; opacity: 0; animation: rise .5s var(--ease) forwards; }
.crow .t { font-size: 13.5px; color: var(--ink2); margin-bottom: 5px; }
.crow.me .t { color: var(--ink); font-weight: 600; }
.crow .bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.07); overflow: hidden; }
.crow .bar i { display: block; height: 100%; width: 0; border-radius: 4px; background: #5D6D84; transition: width 1.1s var(--ease); }
.crow.me .bar i { background: var(--ink); }
.crow.stay .bar i { background: var(--green); }
.crow.fd .bar i { background: var(--gold); }
.crow .v { text-align: right; font-weight: 600; font-size: 14.5px; }
.crow .v small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 500; }
.e-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; }
.e-chart { position: relative; height: 210px; margin-top: 18px; }
.foot { font-size: 11.5px; color: var(--muted); margin-top: 18px; line-height: 1.5; }

@media (max-width: 760px) {
  .screen { padding: 20px 16px; }
  .s-title { font-size: 34px; } .e-h { font-size: 30px; }
  .nums { grid-template-columns: 1fr 1fr; } .n.hero { grid-column: 1 / -1; }
  .chartwrap { height: 260px; }
  .e-grid { grid-template-columns: 1fr; }
  .thoughts { max-width: 92%; }
}
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; } }
</style>
</head>
<body>
<div class="stage" id="stage">

<!-- SETUP -->
<section class="screen on" id="setup">
  <div class="eyebrow">PRISM Games</div>
  <div class="s-title">Can you <em>handle</em> it?</div>
  <p class="s-lede" id="lede"></p>
  <div class="lbl">Pick your peak</div>
  <div class="scen" id="scen"></div>
  <div class="row">
    <div>
      <div class="lbl">How you invest</div>
      <div class="seg" id="mode"><button data-m="lump" class="on">Lump sum</button><button data-m="sip">Monthly SIP</button></div>
      <div class="amts" id="amts"></div>
    </div>
  </div>
  <div class="go-row">
    <button class="btn" id="go">Invest at the peak <span class="kbd">Enter</span></button>
    <span class="warn">It plays month by month. You can sell any time.</span>
  </div>
</section>

<!-- PLAY -->
<section class="screen" id="play">
  <div class="p-top">
    <div>
      <div class="p-name" id="p-name"></div>
      <div class="p-date"><span id="p-date"></span><small id="p-elapsed"></small></div>
    </div>
    <div class="ctl">
      <div class="pulse"><svg class="heart beat" id="heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2 0 3.6 1.1 4.4 2.6h1.8c.8-1.5 2.4-2.6 4.4-2.6 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>
        <span class="num" id="bpm">72</span> bpm</div>
      <div class="seg" id="speed"><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button></div>
      <button class="icon" id="pause" title="Pause (Space)"><svg viewBox="0 0 16 16" id="pause-ico"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg></button>
      <button class="icon" id="skip" title="Skip to the end"><svg viewBox="0 0 16 16"><path d="M2 2.5v11l7-5.5zM9 2.5v11l5.5-5.5z"/></svg></button>
    </div>
  </div>
  <div class="nums">
    <div class="n hero"><label id="l-val">Your money now</label><b class="num" id="v-val">₹0</b></div>
    <div class="n"><label>Put in</label><b class="num" id="v-inv">₹0</b></div>
    <div class="n"><label>Return</label><b class="num" id="v-abs">0%</b></div>
    <div class="n"><label>XIRR</label><b class="num" id="v-xirr">—</b></div>
    <div class="n"><label>Underwater</label><b class="num" id="v-under">0 mo</b></div>
  </div>
  <div class="chartwrap"><canvas id="cv"></canvas><div class="thoughts" id="thoughts"></div></div>
  <div class="legend" id="legend"></div>
  <div class="p-bottom">
    <div class="status" id="status"></div>
    <button class="sell" id="sell">I can't handle it. Sell. <span class="kbd">S</span></button>
  </div>
</section>

<!-- END -->
<section class="screen" id="end">
  <div class="eyebrow" id="e-eyebrow"></div>
  <div class="e-h" id="e-h"></div>
  <p class="e-p" id="e-p"></p>
  <div class="e-grid">
    <div>
      <div class="lbl">What you went through</div>
      <div class="pain" id="pain"></div>
      <div class="e-chart"><canvas id="cv2"></canvas></div>
    </div>
    <div>
      <div class="lbl" id="cmp-lbl">Where the money ended up</div>
      <div class="cmp" id="cmp"></div>
    </div>
  </div>
  <div class="e-btns">
    <button class="btn" id="again">Try another peak <span class="kbd">Enter</span></button>
    <button class="btn ghost" id="replay">Replay this one</button>
  </div>
  <div class="foot" id="foot"></div>
</section>

</div>
<script>
const D = __DATA__;
(() => {
  const $ = id => document.getElementById(id);
  const FD_RATE = 0.07;
  const L = D.levels.map(([d, v]) => ({ t: Date.parse(d + "T00:00:00Z"), d, v }));
  const CMP = D.compare ? D.compare.levels : null;
  const DAY = 864e5;

  // real events, for flags on the chart (only those inside the data are shown)
  const EVENTS = [
    ["2000-04-14", "Dot-com bubble bursts"], ["2001-09-11", "9/11 attacks"], ["2004-05-17", "Market crashes after the election result"],
    ["2008-01-21", "Black Monday: Sensex falls 1,400 points"], ["2008-09-15", "Lehman Brothers collapses"],
    ["2009-05-18", "Election result: markets hit the upper circuit"], ["2011-08-05", "US loses its AAA rating"],
    ["2013-05-22", "Taper tantrum begins"], ["2014-05-16", "Election result day"], ["2016-11-08", "Demonetisation announced"],
    ["2018-02-01", "Budget brings back long-term capital gains tax"], ["2018-09-21", "IL&FS and DHFL panic"],
    ["2020-03-23", "Covid crash: Sensex falls 13% in a day"], ["2020-03-24", "Nationwide lockdown announced"],
    ["2022-02-24", "Russia invades Ukraine"], ["2024-06-04", "Election result day sell-off"], ["2025-04-07", "US tariff shock hits markets"],
  ].map(([d, txt]) => ({ t: Date.parse(d + "T00:00:00Z"), d, txt }));

  // ---------- formatting ----------
  const inr = v => "₹" + Math.round(v).toLocaleString("en-IN");
  function short(v) {
    const a = Math.abs(v), s = v < 0 ? "−" : "";
    if (a >= 1e7) return s + "₹" + (a / 1e7).toFixed(a >= 1e8 ? 1 : 2) + " Cr";
    if (a >= 1e5) return s + "₹" + (a / 1e5).toFixed(a >= 1e6 ? 1 : 2) + " L";
    if (a >= 1e3) return s + "₹" + (a / 1e3).toFixed(0) + "k";
    return s + "₹" + Math.round(a);
  }
  const pct = (v, d = 1) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d) + "%";
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const monthName = t => { const d = new Date(t); return MON[d.getUTCMonth()] + " " + d.getUTCFullYear(); };
  const LONGMON = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const longMonth = t => { const d = new Date(t); return LONGMON[d.getUTCMonth()] + " " + d.getUTCFullYear(); };
  function dur(ms) {
    const m = Math.max(0, Math.round(ms / (30.44 * DAY))), y = Math.floor(m / 12), r = m % 12;
    if (y === 0) return `${r} month${r === 1 ? "" : "s"}`;
    return `${y} yr${y > 1 ? "s" : ""}` + (r ? ` ${r} mo` : "");
  }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = t => 1 - Math.pow(1 - t, 3);

  function xirr(flows, endT, endV) {        // flows: [{t, a}] (a < 0 = money in)
    const all = [...flows, { t: endT, a: endV }], t0 = all[0].t;
    if ((endT - t0) / DAY < 90) return null;
    const f = r => all.reduce((s, x) => s + x.a / Math.pow(1 + r, (x.t - t0) / (365 * DAY)), 0);
    let lo = -0.99, hi = 10, flo = f(lo), fhi = f(hi);
    if (flo * fhi > 0) return null;
    for (let i = 0; i < 80; i++) { const mid = (lo + hi) / 2, fm = f(mid); if (flo * fm <= 0) { hi = mid; fhi = fm; } else { lo = mid; flo = fm; } }
    return (lo + hi) / 2 * 100;
  }

  // ---------- setup ----------
  const AMTS = { lump: [100000, 500000, 1000000, 2500000], sip: [5000, 10000, 25000, 50000] };
  const cfg = { scen: 0, mode: "lump", amt: { lump: 1000000, sip: 10000 } };
  const scen = D.scenarios;
  const idxAt = t => { let lo = 0, hi = L.length - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (L[m].t < t) lo = m + 1; else hi = m; } return lo; };

  $("lede").innerHTML = `We'll put your money into <b>${D.name}</b> at one of its worst possible moments: the very top, right before a crash.
    Then you live through what came next, month by month, with the same news and the same numbers investors saw.
    The <b>Sell</b> button is always there. The only question is whether you press it.`;

  function sparkSVG(s) {
    const a = idxAt(Date.parse(s.peak)), endT = s.recovery ? Date.parse(s.recovery) : L[L.length - 1].t;
    const b = Math.min(L.length - 1, idxAt(endT) + Math.round((idxAt(endT) - a) * 0.25) + 4);
    const pts = L.slice(a, b + 1), lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
    const W = 200, H = 46, x = i => i / (pts.length - 1) * W, y = v => 4 + (1 - (v - lo) / (hi - lo || 1)) * (H - 8);
    const peakY = y(pts[0].v);
    const d = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
    const fill = `M0,${peakY}` + pts.map((p, i) => `L${x(i).toFixed(1)},${Math.max(peakY, y(p.v)).toFixed(1)}`).join("") + `L${W},${peakY}Z`;
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${fill}" fill="rgba(240,82,95,.22)"/>
      <line x1="0" x2="${W}" y1="${peakY}" y2="${peakY}" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 3"/>
      <path d="${d}" fill="none" stroke="#F0525F" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
  }
  function renderSetup() {
    if (!scen.length) {
      $("scen").innerHTML = `<div class="warn">This one hasn't had a fall of 15% or more in its history. Try something bumpier.</div>`;
      $("go").disabled = true; return;
    }
    if (cfg.scen >= scen.length) cfg.scen = 0;
    $("scen").innerHTML = scen.map((s, i) => {

      return `<button class="sc ${i === cfg.scen ? "on" : ""}" data-i="${i}">${sparkSVG(s)}<b>${monthName(Date.parse(s.peak))} peak</b>

    }).join("");
    $("scen").querySelectorAll(".sc").forEach(b => b.addEventListener("click", () => { cfg.scen = +b.dataset.i; renderSetup(); }));
    document.querySelectorAll("#mode button").forEach(b => b.classList.toggle("on", b.dataset.m === cfg.mode));
    $("amts").innerHTML = AMTS[cfg.mode].map(a => `<button data-a="${a}" class="${a === cfg.amt[cfg.mode] ? "on" : ""}">

  document.querySelectorAll("#mode button").forEach(b => b.addEventListener("click", () => { cfg.mode = b.dataset.m; renderSetup(); }));
  // default: the deepest fall

  // ---------- simulation ----------
  let G = null;
  function simulate() {

  function start() {

      underStart: null, underMs: 0, longestUnder: 0, fired: new Set(), lastShake: 0, peakBpm: 72, underSips: 0, ymin: null, ymax: null,
      evIdx: EVENTS.findIndex(e => e.t >= G.rows[0].t) });

    document.querySelectorAll("#speed button").forEach(b => b.classList.toggle("on", b.dataset.s === "1"));
    $("thoughts").innerHTML = "";
    $("p-name").textContent = `${D.name} · invested at the ${monthName(G.rows[0].t)} peak · ${G.sip ? short(G.amt) + " a month" : short(G.amt) + " lump sum"}`;
    $("l-val").textContent = "Your money now";
    $("sell").disabled = false; $("sell").innerHTML = `I can't handle it. Sell. <span class="kbd">S</span>`;
    $("legend").innerHTML = `<span><i style="border-color:#EEF2F7"></i>Your money</span><span><i style="border-color:rgba(255,255,255,.4);border-top-style:dashed"></i>What you put in</span>
      <span><i style="border-color:#E3B45E;border-top-style:dotted"></i>Fixed deposit at 7%</span>` +
      (CMP ? `<span><i style="border-color:#8FB4E8;border-top-style:dotted"></i>${D.compare.name}</span>` : "");
    show("play"); sizeCanvas(); setPause(false);
    think(G.sip ? `First SIP of ${short(G.amt)} goes in. Markets are at an all-time high.` : `${short(G.amt)} invested. Markets are at an all-time high. What could go wrong?`, "", "Day one");

  // ---------- canvas ----------
  const cv = $("cv"), ctx = cv.getContext("2d"); let W = 0, H = 0;
  function sizeCanvas() {
    const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", () => { if (G) sizeCanvas(); });

  function myVal(i) { return G.sold && i >= G.sold.i ? G.sold.val : G.rows[i].val; }
  function myInv(i) { return G.sold && i >= G.sold.i ? G.sold.inv : G.rows[i].inv; }

  function draw(posF) {
    const R = G.rows, n = R.length, k = Math.floor(posF), frac = posF - k;
    const pl = 8, pr = 64, pt = 16, pb = 26, cw = W - pl - pr, ch = H - pt - pb;
    // y range: what has happened so far, eased so the axis breathes instead of jumping
    let lo = Infinity, hi = -Infinity;
    for (let i = 0; i <= k; i++) { const r = R[i]; lo = Math.min(lo, r.val, r.inv, r.fd, myVal(i)); hi = Math.max(hi, r.val, r.inv, r.fd, myVal(i));
      if (r.cmp != null) { lo = Math.min(lo, r.cmp); hi = Math.max(hi, r.cmp); } }
    lo = Math.max(0, lo * 0.9); hi = hi * 1.06;
    G.ymin = G.ymin == null ? lo : G.ymin + (lo - G.ymin) * 0.08; G.ymax = G.ymax == null ? hi : G.ymax + (hi - G.ymax) * 0.08;
    // the camera: the window grows with time, so the fall fills the screen instead of a sliver of 18 years
    const t0 = R[0].t, tNow = R[k].t, YR = 365 * DAY;
    const want = Math.min(R[n - 1].t, Math.max(t0 + 3.5 * YR, tNow + 1.1 * YR));
    G.xEnd = G.xEnd == null ? want : G.xEnd + (want - G.xEnd) * 0.06;
    const t1 = Math.max(G.xEnd, tNow + DAY);
    const X = t => pl + (t - t0) / (t1 - t0) * cw, Y = v => pt + (1 - (v - G.ymin) / (G.ymax - G.ymin || 1)) * ch;
    ctx.clearRect(0, 0, W, H);

    // grid and year ticks
    ctx.font = "11px Inter, system-ui, sans-serif"; ctx.textAlign = "left";
    const step = niceStep((G.ymax - G.ymin) / 4);
    for (let v = Math.ceil(G.ymin / step) * step; v <= G.ymax; v += step) {
      const y = Y(v); ctx.strokeStyle = "rgba(255,255,255,.06)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(pl, y); ctx.lineTo(W - pr, y); ctx.stroke();
      ctx.fillStyle = "#7D8DA3"; ctx.fillText(short(v), W - pr + 8, y + 4);
    }
    const y0 = new Date(t0).getUTCFullYear(), y1 = new Date(t1).getUTCFullYear(), every = Math.max(1, Math.ceil((y1 - y0) / 9));
    ctx.textAlign = "center"; ctx.fillStyle = "#5F7088";
    for (let yy = y0 + 1; yy <= y1; yy++) if ((yy - y0) % every === 0 && Date.UTC(yy, 0, 1) <= t1) { const x = X(Date.UTC(yy, 0, 1)); ctx.fillText(yy, x, H - 8);
      ctx.strokeStyle = "rgba(255,255,255,.04)"; ctx.beginPath(); ctx.moveTo(x, pt); ctx.lineTo(x, H - pb); ctx.stroke(); }
    // the future, not yet lived
    const xnow = k < n - 1 ? X(R[k].t + (R[k + 1].t - R[k].t) * frac) : X(R[k].t);
    ctx.fillStyle = "rgba(255,255,255,.025)"; ctx.fillRect(xnow, pt, W - pr - xnow, ch);

    // event flags already passed
    EVENTS.forEach(e => { if (e.t >= t0 && e.t <= R[k].t) { const x = X(e.t);
      ctx.strokeStyle = "rgba(227,180,94,.28)"; ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.moveTo(x, pt); ctx.lineTo(x, H - pb); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = "rgba(227,180,94,.85)"; ctx.beginPath(); ctx.arc(x, pt + 2, 2.5, 0, Math.PI * 2); ctx.fill(); } });

    const pts = []; for (let i = 0; i <= k; i++) pts.push(i);
    const head = (get) => k < n - 1 ? get(k) + (get(k + 1) - get(k)) * frac : get(k);
    // fill between your money and what you put in: red below, green above
    for (let j = 1; j < pts.length + (k < n - 1 ? 1 : 0); j++) {
      const i0 = j - 1, i1 = j <= k ? j : null;
      const xa = X(R[i0].t), xb = i1 != null ? X(R[i1].t) : xnow;
      const va = myVal(i0), vb = i1 != null ? myVal(i1) : head(myVal), ia = myInv(i0), ib = i1 != null ? myInv(i1) : head(myInv);
      const under = (va + vb) / 2 < (ia + ib) / 2;
      ctx.fillStyle = under ? "rgba(240,82,95,.28)" : "rgba(63,207,142,.20)";
      ctx.beginPath(); ctx.moveTo(xa, Y(va)); ctx.lineTo(xb, Y(vb)); ctx.lineTo(xb, Y(ib)); ctx.lineTo(xa, Y(ia)); ctx.closePath(); ctx.fill();
    }
    const line = (get, color, w, dash, alpha = 1) => {
      ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = w; ctx.setLineDash(dash || []); ctx.lineJoin = "round";
      ctx.beginPath(); let started = false;
      for (let i = 0; i <= k; i++) { const v = get(i); if (v == null) { started = false; continue; } const x = X(R[i].t), y = Y(v);
        if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y); }

    };
    line(i => R[i].fd, "#E3B45E", 1.6, [2, 4], .9);
    if (CMP) line(i => R[i].cmp, "#8FB4E8", 1.6, [2, 4], .8);
    line(myInv, "rgba(255,255,255,.45)", 1.4, [5, 4]);
    if (G.sold) line(i => (i >= G.sold.i ? R[i].val : null), "rgba(63,207,142,.75)", 1.8, [6, 4]);   // what you'd have had

      ctx.fillStyle = "#F0525F"; ctx.beginPath(); ctx.arc(sx, sy, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#F0525F"; ctx.font = "600 11px Inter, system-ui"; ctx.textAlign = "center"; ctx.fillText("You sold", sx, sy - 12); }
  }
  function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))), m = raw / p; return (m < 1.5 ? 1 : m < 3 ? 2 : m < 7 ? 5 : 10) * p; }

  // ---------- thoughts ----------
  function think(text, cls = "", tag = "") {
    const box = $("thoughts"), el = document.createElement("div");
    el.className = "thought " + cls; el.innerHTML = (tag ? `<small>${tag}</small>` : "") + text;
    box.prepend(el);
    while (box.children.length > 3) box.lastChild.remove();
    const life = 4200 / Math.sqrt(G ? G.speed : 1);
    setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 500); }, life);
  }
  function once(key, fn) { if (!G.fired.has(key)) { G.fired.add(key); fn(); } }

  // ---------- the loop ----------
  let last = 0;

  function tick(now) {

    const R = G.rows, n = R.length;

      // slow down in the worst stretches, so the pain is felt

      const drag = pnl < -0.25 ? 0.75 : 1;

  }

  function step(i) {
    const r = G.rows[i], val = myVal(i), inv = myInv(i), pnl = val / inv - 1;
    // pain bookkeeping (only while you're still in)
    if (!G.sold) {
      if (pnl < G.maxPain) { G.maxPain = pnl; G.maxPainT = r.t;
        if (pnl < -0.2 && performance.now() - G.lastShake > 2500) { G.lastShake = performance.now(); const st = $("stage");
          st.classList.remove("shake"); void st.offsetWidth; st.classList.add("shake"); } }
      if (pnl < 0) { if (G.underStart == null) G.underStart = r.t; G.longestUnder = Math.max(G.longestUnder, r.t - G.underStart);
        if (r.put) G.underSips++; }
      else if (G.underStart != null) {
        const took = r.t - G.underStart;

        G.underStart = null;
      }
      const lost = inv - val;
      if (pnl <= -0.10) once("p10", () => think(`Down 10%. Just a correction. Probably.`, "bad"));
      if (pnl <= -0.20) once("p20", () => think(`Down 20%. The news is calling it a bear market.`, "bad"));
      if (pnl <= -0.30) once("p30", () => think(`<b>${short(lost)}</b> gone. It's only on paper, but it doesn't feel like paper.`, "bad"));
      if (pnl <= -0.40) once("p40", () => think(`Down 40%. Every instinct is telling you to get out.`, "bad"));
      if (pnl <= -0.50) once("p50", () => think(`Half of it, gone. This is where most people sell.`, "bad"));
      if (pnl <= -0.60) once("p60", () => think(`Down 60%. From here it needs to rise 150% just to get back to zero.`, "bad"));
      if (G.underStart != null) {
        const u = r.t - G.underStart;
        [[0.5, "Six months in, and still down " + pct(pnl * 100, 0) + "."], [1, "A full year underwater."],
         [2, `Two years. The fixed deposit would be at ${short(r.fd)} by now.`], [3, `Three years, and still negative. Still holding?`],
         [4, `Four years underwater. Your friends stopped asking about your investments.`], [5, `Five years. Most people have given up by now.`]]
          .forEach(([y, txt]) => { if (u >= y * 365 * DAY) once("u" + y + "_" + G.underStart, () => think(txt, "bad", longMonth(r.t))); });
        if (G.sip && r.put && pnl < -0.05) { G.sipCount = (G.sipCount || 0) + 1;
          if (G.sipCount % 6 === 3) think(`Another ${short(G.amt)} SIP goes in. You're still down ${pct(pnl * 100, 0)}. Keep paying?`, "bad", longMonth(r.t)); }
      }
      if (pnl >= 0.5 && G.maxPain < -0.2) once("g50", () => think(`Up 50%. Remember wanting to sell at ${pct(G.maxPain * 100, 0)}?`, "good"));
      if (pnl >= 1.0) once("g100", () => think(`Your money has doubled.`, "good"));
    } else {
      const stay = r.val / r.inv - 1;
      if (stay > G.sold.pnl + 0.3) once("miss30", () => think(`Since you sold, it's up ${pct((r.val / G.rows[G.sold.i].val - 1) * 100, 0)}. You're watching from the outside.`, "bad"));
      if (r.val >= r.inv && G.sold.pnl < 0) once("missback", () => think(`It's back above what you put in. You'd be in profit now.`, "bad", longMonth(r.t)));
    }
    // real events as they happen
    while (G.evIdx < EVENTS.length && EVENTS[G.evIdx].t <= r.t) { const e = EVENTS[G.evIdx]; think(e.txt, "event", longMonth(e.t)); G.evIdx++; }
  }

  function hud(i) {
    const r = G.rows[i], val = myVal(i), inv = myInv(i), pnl = val / inv - 1;
    $("p-date").textContent = longMonth(r.t);
    $("p-elapsed").textContent = dur(r.t - G.rows[0].t) + " in";
    const vb = $("v-val"); vb.textContent = inr(val); vb.className = "num " + (pnl < -0.001 ? "neg" : pnl > 0.001 ? "pos" : "");
    $("v-inv").textContent = inr(inv);
    const ab = $("v-abs"); ab.textContent = pct(pnl * 100); ab.className = "num " + (pnl < 0 ? "neg" : "pos");
    const fl = G.sold ? G.flows.filter(f => f.i <= G.sold.i) : G.flows.filter(f => f.i <= i);
    const x = xirr(fl, G.sold ? G.rows[G.sold.i].t : r.t, val);
    const xb = $("v-xirr"); xb.textContent = x == null ? "—" : pct(x); xb.className = "num " + (x == null ? "" : x < 0 ? "neg" : "pos");
    const u = G.sold ? 0 : (G.underStart != null ? r.t - G.underStart : 0);
    $("v-under").textContent = u ? dur(u) : "—";

      ? `You sold in <b>${longMonth(G.rows[G.sold.i].t)}</b> at <b>${pct(G.sold.pnl * 100, 0)}</b>. The green dashes are what you'd have if you'd stayed.`
      : pnl < -0.3 ? `Deepest so far: <b>${pct(G.maxPain * 100, 0)}</b>. Nobody would blame you.`

  function sell() {
    if (!G || G.sold || G.done) return;
    const i = Math.floor(G.pos), r = G.rows[i];
    G.sold = { i, val: r.val, inv: r.inv, pnl: r.val / r.inv - 1, t: r.t };
    $("sell").disabled = true; $("sell").textContent = "Sold";
    $("l-val").textContent = "Your money (sold)";

  }

  function setPause(p) {
    if (!G) return; G.paused = p;
    $("pause-ico").innerHTML = p ? `<path d="M4 2.5v11l9-5.5z"/>` : `<rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/>`;
  }
  function skip() { if (!G || G.done) return; const R = G.rows; for (let i = Math.floor(G.pos) + 1; i < R.length; i++) stepQuiet(i); G.pos = R.length - 1; }
  function stepQuiet(i) {     // bookkeeping without the drama
    const r = G.rows[i], val = myVal(i), inv = myInv(i), pnl = val / inv - 1;
    if (G.sold) return;
    if (pnl < G.maxPain) { G.maxPain = pnl; G.maxPainT = r.t; }
    if (pnl < 0) { if (G.underStart == null) G.underStart = r.t; G.longestUnder = Math.max(G.longestUnder, r.t - G.underStart); if (r.put) G.underSips++; }

  // ---------- end ----------
  function finish() {
    const R = G.rows, n = R.length, endR = R[n - 1];
    const stay = { val: endR.val, inv: endR.inv, x: xirr(G.flows, endR.t, endR.val) };
    const mine = G.sold ? { val: G.sold.val, inv: G.sold.inv,
      x: xirr(G.flows.filter(f => f.i <= G.sold.i), G.sold.t, G.sold.val) } : stay;
    const fd = { val: endR.fd, x: xirr(G.flows, endR.t, endR.fd) };
    const cmp = CMP && endR.cmp != null ? { val: endR.cmp, x: xirr(G.flows, endR.t, endR.cmp) } : null;
    const yrs = dur(endR.t - R[0].t), stillUnder = endR.val < endR.inv;
    $("e-eyebrow").textContent = `${D.name} · ${monthName(R[0].t)} to ${monthName(endR.t)} · ${yrs}`;
    let h, p;
    if (!G.sold) {
      if (stillUnder) { h = "You're still underwater. And still holding.";
        p = `This fall hasn't finished yet: you're at ${pct((endR.val / endR.inv - 1) * 100, 0)} today, ${dur(G.longestUnder)} after it started.
          That's the hardest place to be, and the place where patience is actually tested. You didn't press the button.`; }
      else { h = G.maxPain <= -0.3 || G.longestUnder >= 365 * DAY ? "You handled it." : "You handled it. This time it was gentle.";
        p = `You sat through a fall of <b>${pct(G.maxPain * 100, 0)}</b> and <b>${dur(G.longestUnder)}</b> underwater without selling.
          ${G.sip && G.underSips ? `<b>${G.underSips}</b> of your SIP instalments went in while you were down; those bought the cheapest units of the whole ride. ` : ""}

    } else {
      const better = stay.val > mine.val, diff = Math.abs(stay.val - mine.val);
      h = `You blinked at ${pct(G.sold.pnl * 100, 0)}.`;
      p = better
        ? `You sold in ${longMonth(G.sold.t)}, ${dur(G.sold.t - R[0].t)} in. Holding on would have turned your ${short(stay.inv)} into <b>${short(stay.val)}</b>${stay.x != null ? ` (${pct(stay.x)} a year)` : ""}.
           Selling locked in ${short(mine.val)}, <b>${short(diff)} less</b>. The fall was temporary. The exit made it permanent.`
        : `You sold in ${longMonth(G.sold.t)}, and this time it saved you ${short(diff)}: it's still lower today. But you'd also have had to know when to get back in,
           and almost nobody does. Most falls in this history did recover.`;
    }
    $("e-h").textContent = h; $("e-p").innerHTML = p;
    const tiles = [
      ["Deepest fall you felt", pct(G.maxPain * 100, 0), "neg"],
      ["Longest stretch underwater", G.longestUnder ? dur(G.longestUnder) : "None", ""],
      ["Highest pulse", G.peakBpm + " bpm", ""],
      [G.sip ? "SIPs paid while down" : "Fall in the index", G.sip ? String(G.underSips) : pct(G.s.depth, 0), G.sip ? "" : "neg"],
    ];
    $("pain").innerHTML = tiles.map(([l, v, c]) => `<div class="n"><label>${l}</label><b class="num ${c}">${v}</b></div>`).join("");
    const rows = [];
    if (G.sold) rows.push({ t: "You (sold)", v: mine.val, x: mine.x, cls: "me" }, { t: "If you'd stayed", v: stay.val, x: stay.x, cls: "stay" });
    else rows.push({ t: "You (held on)", v: stay.val, x: stay.x, cls: "me" });
    rows.push({ t: "Fixed deposit at 7%", v: fd.val, x: fd.x, cls: "fd" });
    if (cmp) rows.push({ t: D.compare.name, v: cmp.val, x: cmp.x });
    rows.push({ t: "What you put in", v: G.sold ? stay.inv : stay.inv, x: null });
    const top = Math.max(...rows.map(r => r.v));
    $("cmp").innerHTML = rows.map((r, i) => `<div class="crow ${r.cls || ""}" style="animation-delay:${200 + i * 90}ms">
      <div><div class="t">${r.t}</div><div class="bar"><i data-w="${r.v / top * 100}"></i></div></div>
      <div class="v num">${short(r.v)}${r.x != null ? `<small>${pct(r.x)} a year</small>` : ""}</div></div>`).join("");
    setTimeout(() => document.querySelectorAll("#cmp .bar i").forEach(b => b.style.width = b.dataset.w + "%"), 350);
    $("foot").innerHTML = `${D.kind === "fund" ? "NAV from mfapi.in" : "Total return index levels from NSE Indices via FinAPI"}, weekly, to ${D.asOf}.
      SIPs go in on the first trading week of each month. The fixed deposit compounds at 7% a year, before tax. XIRR is the annualised return on your actual cash flows.`;
    document.documentElement.style.setProperty("--pain", "0"); document.documentElement.style.setProperty("--gain", (stay.val > stay.inv ? .5 : 0).toString());
    show("end");
    requestAnimationFrame(() => drawEnd());
  }
  function drawEnd() {
    const c = $("cv2"), x = c.getContext("2d"), r = c.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.width = r.width * dpr; c.height = r.height * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
    const R = G.rows, n = R.length, Wd = r.width, Hd = r.height, pad = 6;
    // log scale, so a 50% fall looks as big as it felt, even next to years of growth
    // (a SIP starts from almost nothing, so it stays on a normal scale)
    const tf = G.sip ? (v => v) : (v => Math.log(Math.max(v, 1)));
    const vals = R.flatMap((q, i) => [q.val, q.inv, myVal(i)]).filter(v => v > 0).map(tf);
    const lo0 = Math.min(...vals), hi0 = Math.max(...vals), padv = (hi0 - lo0) * .05, lo = lo0 - padv, hi = hi0 + padv;
    const X = i => pad + i / (n - 1) * (Wd - pad * 2), Y = v => pad + (1 - (tf(v) - lo) / (hi - lo)) * (Hd - pad * 2);
    const path = (get, col, w, dash) => { x.strokeStyle = col; x.lineWidth = w; x.setLineDash(dash || []); x.beginPath();
      R.forEach((q, i) => { const v = get(i); i ? x.lineTo(X(i), Y(v)) : x.moveTo(X(i), Y(v)); }); x.stroke(); x.setLineDash([]); };
    for (let i = 1; i < n; i++) { const under = R[i].val < R[i].inv; x.fillStyle = under ? "rgba(240,82,95,.25)" : "rgba(63,207,142,.18)";
      x.beginPath(); x.moveTo(X(i - 1), Y(R[i - 1].val)); x.lineTo(X(i), Y(R[i].val)); x.lineTo(X(i), Y(R[i].inv)); x.lineTo(X(i - 1), Y(R[i - 1].inv)); x.fill(); }
    path(i => R[i].inv, "rgba(255,255,255,.4)", 1.2, [5, 4]);
    path(i => R[i].val, G.sold ? "rgba(63,207,142,.8)" : "#EEF2F7", 2.2, G.sold ? [6, 4] : null);
    if (G.sold) { path(i => myVal(i), "#EEF2F7", 2.2); x.fillStyle = "#F0525F"; x.beginPath(); x.arc(X(G.sold.i), Y(G.sold.val), 4.5, 0, Math.PI * 2); x.fill(); }
  }

  // ---------- plumbing ----------
  function show(id) { ["setup", "play", "end"].forEach(s => $(s).classList.toggle("on", s === id)); }
  $("go").addEventListener("click", start);
  $("sell").addEventListener("click", sell);
  $("pause").addEventListener("click", () => setPause(!G.paused));
  $("skip").addEventListener("click", skip);
  document.querySelectorAll("#speed button").forEach(b => b.addEventListener("click", () => { G.speed = +b.dataset.s;
    document.querySelectorAll("#speed button").forEach(x => x.classList.toggle("on", x === b)); }));
  $("again").addEventListener("click", () => { G = null; document.documentElement.style.setProperty("--gain", "0"); renderSetup(); show("setup"); });
  $("replay").addEventListener("click", start);
  document.addEventListener("keydown", e => {
    const on = id => $(id).classList.contains("on");
    if (on("setup") && e.key === "Enter") start();
    else if (on("play")) { if (e.key === " ") { e.preventDefault(); setPause(!G.paused); } if (e.key === "s" || e.key === "S") sell(); }
    else if (on("end") && e.key === "Enter") $("again").click();
  });
})();
</script>
</body>
</html>
