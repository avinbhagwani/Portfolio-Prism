<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face { font-family: Inter; src: url("/app/static/fonts/Inter-Regular.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: Inter; src: url("/app/static/fonts/Inter-Medium.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: Inter; src: url("/app/static/fonts/Inter-SemiBold.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: Inter; src: url("/app/static/fonts/Inter-Bold.woff2") format("woff2"); font-weight: 700; }
@font-face { font-family: "IBM Plex Mono"; src: url("/app/static/fonts/IBMPlexMono-Regular.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "IBM Plex Mono"; src: url("/app/static/fonts/IBMPlexMono-Medium.woff2") format("woff2"); font-weight: 500; }

:root { --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #05090F;
  font-family: Inter, system-ui, sans-serif; color: #D5DEE8;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
:root { --bar: clamp(34px, 6vh, 56px); }
#stage { position: fixed; inset: 0; overflow: hidden; cursor: grab;
  background: radial-gradient(120% 90% at 50% 50%, #0A1626 0%, #070F1B 55%, #04080F 100%); }
#stage.drag { cursor: grabbing; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }

/* ---------- the lens: vignette, film grain, letterbox, frame marks ---------- */
#vig { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(115% 95% at 50% 50%, rgba(2,5,10,0) 52%, rgba(2,5,10,.5) 82%, rgba(2,5,10,.85) 100%); }
#grain { position: absolute; inset: -64px; pointer-events: none; opacity: .09; mix-blend-mode: overlay;
  animation: grain .5s steps(5) infinite; }
@keyframes grain { 0% { transform: translate(0,0); } 20% { transform: translate(-22px,14px); }
  40% { transform: translate(17px,-31px); } 60% { transform: translate(-36px,-9px); }
  80% { transform: translate(28px,25px); } 100% { transform: translate(0,0); } }
.bar { position: absolute; left: 0; right: 0; height: var(--bar); background: #03060B; pointer-events: none;
  display: flex; align-items: center; justify-content: space-between; gap: 1.5rem;
  padding: 0 clamp(20px, 4vw, 56px); box-sizing: border-box;
  font-family: var(--mono); font-size: .64rem; letter-spacing: .16em; text-transform: uppercase; color: #6C8299; }
.bar b { font-weight: 500; color: #C9D4DF; }
.bar.top { top: 0; border-bottom: 1px solid rgba(159,178,198,.12); animation: barTop .9s cubic-bezier(.2,.7,.2,1) both; }
.bar.bot { bottom: 0; border-top: 1px solid rgba(159,178,198,.12); animation: barBot .9s cubic-bezier(.2,.7,.2,1) both; }
@keyframes barTop { from { transform: translateY(-100%); } to { transform: none; } }
@keyframes barBot { from { transform: translateY(100%); } to { transform: none; } }
.bar .live::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: #D9B36A; margin-right: .7em; vertical-align: 1px; animation: live 2.4s ease-in-out infinite; }
@keyframes live { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
.bar .stats { white-space: nowrap; }
.bar .stats span + span::before { content: "/"; margin: 0 .9em; color: #33475C; }
.bar .hint { transition: opacity .8s ease; white-space: nowrap; padding-right: 13.5rem; }
.bar .hint.gone { opacity: 0; }
.mark { position: absolute; width: 16px; height: 16px; pointer-events: none; border: 0 solid rgba(159,178,198,.38); }
.mark.tl { left: 14px; top: calc(var(--bar) + 12px); border-width: 1px 0 0 1px; }
.mark.tr { right: 14px; top: calc(var(--bar) + 12px); border-width: 1px 1px 0 0; }
.mark.bl { left: 14px; bottom: calc(var(--bar) + 12px); border-width: 0 0 1px 1px; }
.mark.br { right: 14px; bottom: calc(var(--bar) + 12px); border-width: 0 1px 1px 0; }

/* ---------- words ---------- */
.head { position: absolute; left: clamp(20px, 4vw, 56px); top: calc(var(--bar) + clamp(20px, 4.5vh, 44px));
  max-width: 40rem; pointer-events: none; opacity: 0; animation: rise 1s ease .7s forwards; }
.head h1 { font-weight: 700; font-size: clamp(1.9rem, 3.3vw, 2.9rem);
  line-height: 1.06; letter-spacing: -0.028em; color: #F3F6F9; margin: 0 0 .9rem 0; }
.head h1 em { font-style: normal;
  background: linear-gradient(90deg, #7FB0DE, #4FC0C4 30%, #E0B45C 55%, #86C389 75%, #BC90CF);
  -webkit-background-clip: text; background-clip: text; color: transparent; }
.head p { margin: 0; font-size: .95rem; line-height: 1.55; color: #9FB2C6; max-width: 21rem; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- worlds: one real button each, moved every frame ---------- */
.w { position: absolute; left: 0; top: 0; margin: 0; padding: 0; border: 0; background: none;
  color: inherit; font: inherit; cursor: pointer; will-change: transform; outline: none; }
.w .hit { position: absolute; left: 50%; top: 50%; border-radius: 50%; transform: translate(-50%, -50%); }
.w:focus-visible .hit { outline: 2px solid #D9B36A; outline-offset: 3px; }
.w .lab { position: absolute; left: 50%; transform: translateX(-50%); text-align: center;
  white-space: nowrap; pointer-events: none; padding: 5px 10px 6px; border-radius: 2px;
  border-left: 2px solid transparent;
  transition: background .2s ease, box-shadow .2s ease, opacity .3s ease, border-color .2s ease; }
.w .lab em { display: block; font-style: normal; font-family: var(--mono); font-size: .56rem;
  letter-spacing: .2em; text-transform: uppercase; color: var(--c); max-height: 0; opacity: 0; overflow: hidden;
  transition: max-height .25s ease, opacity .25s ease, margin .25s ease; }
.w .lab b { display: block; font-family: var(--mono); font-weight: 500; font-size: .64rem;
  letter-spacing: .16em; text-transform: uppercase; color: #AFC0D1; transition: color .2s ease;
  text-shadow: 0 0 10px rgba(3,6,11,.9); }
.w .lab i { display: block; font-style: normal; font-size: .8rem; line-height: 1.35; color: #C9D4DF;
  max-height: 0; opacity: 0; overflow: hidden; transition: max-height .25s ease, opacity .25s ease, margin .25s ease; }
.w .lab u { display: block; text-decoration: none; font-family: var(--mono); font-size: .6rem;
  letter-spacing: .14em; text-transform: uppercase; color: var(--c); max-height: 0; opacity: 0; overflow: hidden;
  transition: max-height .25s ease, opacity .25s ease, margin .25s ease; }
.w.on { z-index: 5; }
.w.on .lab { text-align: left; background: rgba(3,7,13,.86); border-left-color: var(--c);
  box-shadow: 0 0 0 1px rgba(159,178,198,.16), 0 0 26px -6px color-mix(in srgb, var(--c) 55%, transparent),
  0 14px 34px -12px rgba(0,0,0,.8); backdrop-filter: blur(6px); padding: 9px 14px 10px 12px; }
.w.on .lab em { max-height: 2em; opacity: 1; margin-bottom: 5px; }
.w.on .lab b { color: #fff; font-size: .7rem; }
.w.on .lab i { max-height: 3em; opacity: 1; margin-top: 5px; }
.w.on .lab u { max-height: 2em; opacity: 1; margin-top: 7px; }
.w.back .lab { opacity: .62; }
.w.soon { cursor: default; }
.w.soon .lab b { color: #5D7389; }
.w.soon .lab s { display: block; text-decoration: none; font-family: var(--mono); font-size: .58rem;
  letter-spacing: .12em; text-transform: uppercase; color: #46607A; margin-top: 3px; }
.w.star .lab { opacity: 0; }
.w.star.on .lab { opacity: 1; }
.leaving .w .lab, .leaving .head, .leaving .bar > *, .leaving .mark { opacity: 0 !important; transition: opacity .3s ease; }
.arriving .w .lab, .arriving .head, .arriving .bar > *, .arriving .mark { opacity: 0 !important; }
.arriving .head, .arriving .bar { animation: none; }
.w .lab, .head, .bar > *, .mark { transition: opacity .6s ease; }
#veil { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: #0A1522; z-index: 9; }

@media (max-width: 1320px) { .bar .hint { display: none; } }
@media (max-width: 640px) {
  .head { top: calc(var(--bar) + 22px); }
  .w .lab b { font-size: .56rem; letter-spacing: .08em; }
  .w.soon .lab { display: none; }
  .head p { font-size: .88rem; }
  .bar { font-size: .56rem; letter-spacing: .1em; }
  .bar.top { padding-left: 56px; }
  .bar.top .sys { display: none; }
  .bar .stats span:nth-child(n+3) { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .head, .bar { animation: none; opacity: 1; }
  #grain, .bar .live::before { animation: none; }
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="sky" aria-hidden="true"></canvas>
  <div id="vig"></div>
  <div id="grain"></div>
  <i class="mark tl"></i><i class="mark tr"></i><i class="mark bl"></i><i class="mark br"></i>
  <div class="head">
    <h1>Every return has a <em>spectrum</em>.</h1>
    <p id="lede"></p>
  </div>
  <nav id="worlds" aria-label="PRISM tools"></nav>
  <div class="bar top">
    <span class="live sys"><b>PRISM</b> &nbsp;system map</span>
    <span id="count"></span>
  </div>
  <div class="bar bot">
    <div class="stats" id="stats"></div>
    <div class="hint" id="hint">Click a world to open it &nbsp;/&nbsp; drag to spin</div>
  </div>
  <div id="veil"></div>
</div>

<script>
/* The home page: a small solar system. The star is PRISM; every world is
   a page, shot like a film: letterbox, lens flare, grain, a target lock on
   the world you point at, and stars that streak when the camera flies.
   Worlds are real <button>s (so keyboard and screen readers work)
   that a canvas paints underneath. Clicking one clicks the matching
   Streamlit page link in the parent page, so the session is kept. */
const D = __DATA__;
const stage = document.getElementById("stage"), cv = document.getElementById("sky"), g = cv.getContext("2d");
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const TAU = Math.PI * 2;

/* look of each world; names, purposes and paths come from Python */
const LOOK = {
  "factor-analysis":    { orbit: 0, size: 15, period: 46,  phase: 0.75, c: "#5B93C7", hi: "#A9CDF0", kind: "bands" },
  "fbi-intelligence":   { orbit: 1, size: 17.5, period: 66,  phase: 2.75, c: "#35A3A8", hi: "#8FDCDD", kind: "moon" },
  "drawdown-analysis":  { orbit: 2, size: 16.5, period: 90,  phase: 4.25, c: "#C9604F", hi: "#F0A795", kind: "craters" },
  "efficient-frontier": { orbit: 3, size: 20, period: 120, phase: 5.55, c: "#6BAA6E", hi: "#B5DDB3", kind: "ring" },
  "try-to-time":        { orbit: 4, size: 12.5, period: 158, phase: 1.35, c: "#D2A244", hi: "#F4D48F", kind: "plain" },
  "can-you-handle-it":  { orbit: 4, size: 12.5, period: 158, phase: 1.35 + Math.PI, c: "#A274B5", hi: "#D6B5E3", kind: "plain" },
  "writing":            { comet: true, size: 5, period: 84, phase: 2.2, c: "#C9D7E6", hi: "#FFFFFF", kind: "comet" },
};
const SOON_LOOK = [
  { orbit: 5, size: 8, period: 210, phase: 0.2 },
  { orbit: 5, size: 8, period: 210, phase: 3.45 },
];
const ORBITS = [0.25, 0.38, 0.51, 0.65, 0.81, 0.97];

document.getElementById("lede").textContent = D.lede;
document.getElementById("stats").innerHTML = D.stats.map(s => `<span><b>${s[0]}</b> ${s[1]}</span>`).join("");
document.getElementById("count").innerHTML =
  `<b>${String(D.worlds.length).padStart(2, "0")}</b> worlds charted &nbsp;/&nbsp; <b>${String(D.soon.length).padStart(2, "0")}</b> on approach`;

/* film grain: one small noise tile, jittered by CSS */
(function grain() {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const x = c.getContext("2d"), im = x.createImageData(128, 128);
  for (let i = 0; i < im.data.length; i += 4) {
    const v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255;
  }
  x.putImageData(im, 0, 0);
  document.getElementById("grain").style.backgroundImage = `url(${c.toDataURL()})`;
})();

/* ---------- build the worlds ---------- */
const nav = document.getElementById("worlds");
const worlds = [];
function addWorld(o) {
  const el = document.createElement(o.soon ? "div" : "button");
  el.className = "w" + (o.soon ? " soon" : "");
  el.style.setProperty("--c", o.c || "#7F93A8");
  if (!o.soon) { el.type = "button"; el.setAttribute("aria-label", `${o.name}: ${o.desc}`); }
  el.innerHTML = `<span class="hit"></span><span class="lab">` +
    (o.idx ? `<em>World ${o.idx}</em>` : o.sun ? `<em>The star</em>` : "") + `<b>${o.name}</b>` +
    (o.soon ? `<s>${o.tag}</s>` : `<i>${o.desc}</i><u>${o.cta || "Open"} &rarr;</u>`) + `</span>`;
  if (o.sun) el.classList.add("star");
  nav.appendChild(el);
  o.el = el; o.hit = el.firstChild; o.lab = el.lastChild; o.hover = 0; o.x = o.y = 0;
  worlds.push(o);
  if (o.soon) return;
  el.addEventListener("pointerenter", () => { if (!dragging) setActive(o); });
  el.addEventListener("pointerleave", () => { if (active === o) setActive(null); });
  el.addEventListener("focus", () => setActive(o));
  el.addEventListener("blur", () => { if (active === o) setActive(null); });
  el.addEventListener("click", () => { if (moved < 6) leave(o); });
}
/* tab order follows the navigation: tools, games, writing, then the star */
D.worlds.forEach(w => addWorld(Object.assign({}, LOOK[w.path], w)));
const sun = { sun: true, name: "PRISM", desc: D.tour, cta: "Take the tour", c: "#E8C377", size: 24 };
addWorld(sun);
D.soon.forEach((n, i) => addWorld(Object.assign({ soon: true, name: n, tag: "On the way" }, SOON_LOOK[i % 2])));

let active = null, leaving = false;
function setActive(o) {
  if (leaving) return;
  if (active) { active.el.classList.remove("on"); active.lw = 0; }
  active = o;
  if (o) { o.el.classList.add("on"); document.getElementById("hint").classList.add("gone"); }
}

/* ---------- going somewhere ---------- */
function parentClick(sel) {
  try { const a = window.parent.document.querySelector(sel); if (a) { a.click(); return true; } } catch (e) {}
  return false;
}
function leave(o) {
  if (leaving) return;
  if (o.sun) { parentClick(".st-key-tut_launch_home button"); return; }
  leaving = true; setActiveOff();
  fly = { o, t0: performance.now(), dur: FLY_IN, dir: 1 };
  veil.style.background = o.c;
  stage.classList.add("leaving");
  setTimeout(() => {
    if (parentClick(`.st-key-solar_links a[href="${o.path}"]`)) return;
    if (parentClick(`[data-testid="stSidebar"] a[data-testid="stPageLink-NavLink"][href="${o.path}"]`)) return;
    try { window.parent.location.href = "/" + o.path; } catch (e) {}
  }, still ? 0 : FLY_IN);
}
function setActiveOff() { if (active) { active.el.classList.remove("on"); } }

/* The camera. dir 1 flies into a world until its colour fills the sky;
   dir -1 starts there and pulls back out to the whole system. Zoom is
   exponential (so it feels like steady travel) on an eased clock. */
const FLY_IN = 1150, FLY_OUT = 1700, veil = document.getElementById("veil");
const ease = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
let fly = null, cam = null;
function cameraState(now) {
  cam = null;
  if (!fly || still) { veil.style.opacity = 0; return; }
  let p = Math.max(0, Math.min(1, (now - fly.t0) / fly.dur));
  if (fly.dir < 0) p = 1 - p;                 /* 1 = fully in, 0 = fully out */
  const e = ease(p), o = fly.o;
  const zmax = Math.min(600, 1.5 * Math.hypot(W, H) / Math.max(4, o.r));
  cam = { e, z: Math.exp(e * Math.log(zmax)), o,
          fx: o.x + (W / 2 - o.x) * e, fy: o.y + (H / 2 - o.y) * e,
          warp: Math.sin(Math.PI * Math.min(1, e * 1.25)) };   /* stars streak mid-flight */
  veil.style.opacity = Math.max(0, Math.min(1, (e - 0.72) / 0.24));
  if (fly.dir < 0) {
    if (p < 0.3) stage.classList.remove("arriving");
    if (p <= 0) { fly = null; leaving = false; cam = null; }
  }
}
function cameraApply() {
  if (!cam) return;
  g.translate(cam.fx, cam.fy); g.scale(cam.z, cam.z); g.translate(-cam.o.x, -cam.o.y);
}

/* ---------- layout ---------- */
let W = 0, H = 0, dpr = 1, cx = 0, cy = 0, A = 0, squash = 0.46, unit = 1, stars = [];
function resize() {
  W = stage.clientWidth; H = stage.clientHeight; dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const portrait = W < H * 0.85;
  if (portrait) {
    A = W / 2 - 34; cx = W / 2; cy = H * 0.57;
    squash = Math.max(0.5, Math.min(1.12, (H * 0.43 - 60) / A));
  } else {
    A = Math.min(W / 2 - 84, (H / 2 - 62) / 0.46);
    squash = Math.max(0.46, Math.min(0.62, (H / 2 - 110) / A));
    cx = W * 0.5; cy = H * 0.52;
  }
  unit = Math.max(0.62, Math.min(1.2, A / 430));
  let s = 7;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  /* the few bright stars that twinkle, glint and streak when the camera flies */
  stars = Array.from({ length: Math.round(Math.min(150, W * H / 9000)) }, () => ({
    x: rnd(), y: rnd(), r: 0.5 + rnd() * rnd() * 1.3, a: 0.4 + rnd() * 0.55,
    tw: 0.4 + rnd() * 1.6, ph: rnd() * TAU, d: 0.3 + rnd() * 0.7, glint: rnd() < 0.07,
    tint: rnd() < 0.1 ? "255,214,150" : rnd() < 0.2 ? "160,200,255" : "255,255,255" }));
  paintBackdrop(rnd);
  belt = Array.from({ length: 300 }, () => ({
    a: rnd() * TAU, f: 0.715 + (rnd() + rnd() + rnd() - 1.5) * 0.03, r: 0.4 + rnd() * 0.9, al: 0.2 + rnd() * 0.5 }));
}
/* Deep space, painted once: nebula clouds, a dusty galactic band running
   corner to corner, and thousands of faint stars. */
const back = document.createElement("canvas"), PAD = 26;
let belt = [];
function paintBackdrop(rnd) {
  const w = W + PAD * 2, h = H + PAD * 2;
  back.width = Math.round(w * dpr); back.height = Math.round(h * dpr);
  const b = back.getContext("2d"); b.setTransform(dpr, 0, 0, dpr, 0, 0);
  b.globalCompositeOperation = "lighter";
  const cloud = (x, y, r, rgb, al) => {
    const gr = b.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(${rgb},${al})`); gr.addColorStop(0.5, `rgba(${rgb},${al * 0.35})`);
    gr.addColorStop(1, `rgba(${rgb},0)`);
    b.fillStyle = gr; b.fillRect(x - r, y - r, r * 2, r * 2);
  };
  /* band runs from lower left to upper right */
  const bx = t => w * (-0.05 + 1.1 * t), by = t => h * (1.0 - 1.0 * t) + Math.sin(t * 3.1) * h * 0.06;
  const tints = ["53,140,170", "110,84,190", "38,92,170", "190,120,70", "60,150,150", "130,90,170"];
  for (let i = 0; i < 9; i++) {
    const t = (i + 0.5) / 9 + (rnd() - 0.5) * 0.06;
    cloud(bx(t) + (rnd() - 0.5) * w * 0.1, by(t) + (rnd() - 0.5) * h * 0.2,
          Math.max(w, h) * (0.16 + rnd() * 0.16), tints[i % tints.length], 0.07 + rnd() * 0.05);
  }
  for (let i = 0; i < 3600; i++) {
    const t = rnd(), off = (rnd() + rnd() + rnd() - 1.5) * h * 0.22;
    b.fillStyle = `rgba(${rnd() < 0.15 ? "255,220,180" : "215,228,255"},${0.1 + rnd() * rnd() * 0.6})`;
    const r = 0.3 + rnd() * rnd() * 0.8;
    b.fillRect(bx(t) + off * 0.45, by(t) + off, r, r);
  }
  for (let i = 0; i < Math.min(900, w * h / 1500); i++) {
    b.fillStyle = `rgba(255,255,255,${0.12 + rnd() * rnd() * 0.6})`;
    const r = 0.35 + rnd() * rnd() * 1.0;
    b.fillRect(rnd() * w, rnd() * h, r, r);
  }
}
addEventListener("resize", resize); resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => worlds.forEach(o => { o.lw = 0; }));

/* ---------- pointer: parallax, drag to spin ---------- */
let mx = 0, my = 0, spin = 0, spinV = 0, dragging = false, lastX = 0, moved = 0;
stage.addEventListener("pointermove", e => {
  mx = e.clientX / W - 0.5; my = e.clientY / H - 0.5;
  if (dragging) {
    const dx = e.clientX - lastX; lastX = e.clientX; moved += Math.abs(dx);
    spinV = dx * -0.0045; spin += spinV;
    if (moved > 6) { stage.classList.add("drag"); setActive(null); document.getElementById("hint").classList.add("gone"); }
  }
});
stage.addEventListener("pointerdown", e => { dragging = true; lastX = e.clientX; moved = 0; spinV = 0; });
addEventListener("pointerup", () => { dragging = false; stage.classList.remove("drag"); });
addEventListener("pointercancel", () => { dragging = false; stage.classList.remove("drag"); });
stage.addEventListener("pointerleave", () => { mx = my = 0; });

/* ---------- drawing ---------- */
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}
function drawSky(t) {
  const fade = cam ? 1 - cam.e : 1, warp = cam ? cam.warp : 0;
  g.globalAlpha = fade;
  g.drawImage(back, -PAD - mx * 14, -PAD - my * 14, W + PAD * 2, H + PAD * 2);

let shoot = null, nextShoot = 6;

/* target lock on the world being looked at */
function drawReticle(t, o) {

function drawSun(t, o) {

/* ---------- where everything is ---------- */
