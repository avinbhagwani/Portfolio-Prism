<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Inter; src: url("/app/static/fonts/Inter-Medium.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: Inter; src: url("/app/static/fonts/Inter-SemiBold.woff2") format("woff2"); font-weight: 600; }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  .hint { position: absolute; left: 14px; bottom: 10px; font: 500 12px Inter, sans-serif;
          color: #9AA3AE; letter-spacing: 0.02em; transition: opacity 0.6s ease; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">Move your cursor to bend the light · click to send a pulse</div>
<script>
(() => {
  const FACTORS = [
    ["Market",   "#1F4E79"],
    ["Size",     "#2F8F9D"],
    ["Value",    "#C08A2E"],
    ["Momentum", "#5E9A62"],
    ["Quality",  "#8E5B9F"],
  ];
  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");
  const hint = document.getElementById("hint");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, dpr = 1;
  let mouse = null, lastMove = 0, pulses = [], particles = [], t0 = performance.now();

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth = window.innerWidth; H = cv.clientHeight = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize); resize();

  window.addEventListener("pointermove", e => {
    mouse = { x: e.clientX, y: e.clientY }; lastMove = performance.now();
    hint.style.opacity = 0;
  });
  window.addEventListener("pointerleave", () => { mouse = null; });
  window.addEventListener("pointerdown", e => {
    pulses.push({ born: performance.now() });
    mouse = { x: e.clientX, y: e.clientY }; lastMove = performance.now();
  });

  // geometry helpers
  function prism() {
    const s = Math.min(H * 0.62, W * 0.24);            // side length
    const cx = W * 0.5, cy = H * 0.56;
    const h = s * Math.sqrt(3) / 2;
    return { A: [cx, cy - h * 0.62], B: [cx + s / 2, cy + h * 0.38], C: [cx - s / 2, cy + h * 0.38], s, cx, cy };
  }
  function lerp(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }

  function source(now, P) {
    const idle = !mouse || now - lastMove > 2500;
    let x, y;
    if (idle) {
      const k = (now - t0) / 1000;
      x = W * 0.08 + Math.sin(k * 0.45) * W * 0.03;
      y = P.cy + Math.sin(k * 0.7) * H * 0.22;
    } else {
      x = Math.min(mouse.x, P.C[0] - 30); y = mouse.y;
    }
    return [Math.max(4, x), Math.max(8, Math.min(H - 8, y))];
  }

  function rayLabel(x, y, text, color, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color; ctx.font = "600 13px Inter, sans-serif";
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillText(text, x, y);
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    const P = prism();
    ctx.clearRect(0, 0, W, H);

    // faint grid, like a chart
    ctx.strokeStyle = "rgba(31,78,121,0.06)"; ctx.lineWidth = 1;
    for (let gy = H * 0.15; gy < H; gy += H * 0.17) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); }

    const S = source(now, P);
    // entry point on the left face: where the line from the source to the
    // prism's centre crosses edge A-C (parameter along the edge)
    const dy = S[1] - P.cy;
    const tEntry = Math.max(0.25, Math.min(0.85, 0.55 + dy / (P.s * 1.6)));
    const E = lerp(P.A, P.C, tEntry);
    // exit on the right face, mirrored a little lower (refraction bends down)
    const X = lerp(P.A, P.B, Math.max(0.3, Math.min(0.9, tEntry + 0.08)));
    // incidence angle drives where the spectrum points and how wide it fans
    const inc = Math.atan2(E[1] - S[1], E[0] - S[0]);
    const spread = 0.22 + Math.min(0.5, Math.abs(inc) * 0.55);
    const centre = inc * 0.55 + 0.12;

    // incoming beam: grey, brighter toward the prism, with a glow
    const g = ctx.createLinearGradient(S[0], S[1], E[0], E[1]);
    g.addColorStop(0, "rgba(107,116,128,0.05)"); g.addColorStop(1, "rgba(107,116,128,0.9)");
    ctx.save(); ctx.shadowColor = "rgba(224,177,92,0.55)"; ctx.shadowBlur = 10;
    ctx.strokeStyle = g; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(S[0], S[1]); ctx.lineTo(E[0], E[1]); ctx.stroke(); ctx.restore();
    // source glow
    ctx.fillStyle = "rgba(224,177,92,0.9)"; ctx.beginPath(); ctx.arc(S[0], S[1], 4, 0, Math.PI * 2); ctx.fill();

    // rays out of the right face
    const rays = FACTORS.map(([name, color], i) => {
      const a = centre + spread * (i / (FACTORS.length - 1) - 0.5);
      const len = (W - X[0]) / Math.max(0.2, Math.cos(a)) * 1.2;
      const end = [X[0] + Math.cos(a) * len, X[1] + Math.sin(a) * len];
      return { name, color, a, end };
    });
    // soft spectrum fan behind the rays
    ctx.save(); ctx.globalAlpha = 0.10; ctx.filter = "blur(10px)";
    ctx.beginPath(); ctx.moveTo(X[0], X[1]);
    ctx.lineTo(rays[0].end[0], rays[0].end[1]); ctx.lineTo(rays[4].end[0], rays[4].end[1]); ctx.closePath();
    const fg = ctx.createLinearGradient(0, rays[0].end[1], 0, rays[4].end[1]);
    FACTORS.forEach(([, c], i) => fg.addColorStop(i / 4, c));
    ctx.fillStyle = fg; ctx.fill(); ctx.restore();

    rays.forEach(r => {
      const rg = ctx.createLinearGradient(X[0], X[1], r.end[0], r.end[1]);
      rg.addColorStop(0, r.color); rg.addColorStop(0.7, r.color + "88"); rg.addColorStop(1, r.color + "00");
      ctx.save(); ctx.shadowColor = r.color; ctx.shadowBlur = 6;
      ctx.strokeStyle = rg; ctx.lineWidth = 2.6; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(X[0], X[1]); ctx.lineTo(r.end[0], r.end[1]); ctx.stroke(); ctx.restore();
    });

    // labels where each ray meets the right edge area
    rays.forEach(r => {
      const lx = W - 18;
      const ly = X[1] + Math.tan(r.a) * (lx - X[0]);
      if (ly > 10 && ly < H - 10) rayLabel(lx, ly - 10, r.name, r.color, 0.95);
    });

    // particles of light travelling along the rays
    if (!reduce && Math.random() < 0.5) {
      const r = rays[Math.floor(Math.random() * rays.length)];
      particles.push({ r, p: 0, v: 0.004 + Math.random() * 0.006 });
    }
    particles = particles.filter(q => q.p < 0.75);
    particles.forEach(q => {
      q.p += q.v; const pt = lerp(X, q.r.end, q.p);
      ctx.globalAlpha = 1 - q.p / 0.75; ctx.fillStyle = q.r.color;
      ctx.beginPath(); ctx.arc(pt[0], pt[1], 2.2, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    });

    // refracted path inside the glass
    ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(E[0], E[1]); ctx.lineTo(X[0], X[1]); ctx.stroke();

    // the prism: frosted glass with a highlight
    ctx.save();
    ctx.shadowColor = "rgba(31,78,121,0.22)"; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
    const pg = ctx.createLinearGradient(P.C[0], P.A[1], P.B[0], P.B[1]);
    pg.addColorStop(0, "rgba(220,232,243,0.92)"); pg.addColorStop(0.6, "rgba(159,187,214,0.82)");
    pg.addColorStop(1, "rgba(94,135,174,0.85)");
    ctx.fillStyle = pg; ctx.strokeStyle = "#1F4E79"; ctx.lineWidth = 2.2; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(...P.A); ctx.lineTo(...P.B); ctx.lineTo(...P.C); ctx.closePath();
    ctx.fill(); ctx.restore();
    ctx.strokeStyle = "#1F4E79"; ctx.lineWidth = 2.2; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(...P.A); ctx.lineTo(...P.B); ctx.lineTo(...P.C); ctx.closePath(); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,0.65)"; ctx.lineWidth = 1.6;
    const h1 = lerp(P.A, P.C, 0.12), h2 = lerp(P.A, P.C, 0.85);
    ctx.beginPath(); ctx.moveTo(h1[0] + 6, h1[1] + 4); ctx.lineTo(h2[0] + 10, h2[1] - 4); ctx.stroke();
    // inside refraction drawn on top so it reads through the glass
    ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(E[0], E[1]); ctx.lineTo(X[0], X[1]); ctx.stroke();

    // exit flash and click pulses
    ctx.fillStyle = "rgba(224,177,92,0.85)"; ctx.beginPath(); ctx.arc(X[0], X[1], 3.4, 0, Math.PI * 2); ctx.fill();
    pulses = pulses.filter(p => now - p.born < 1100);
    pulses.forEach(p => {
      const k = (now - p.born) / 1100;
      ctx.strokeStyle = `rgba(224,177,92,${0.6 * (1 - k)})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(X[0], X[1], 8 + k * P.s * 0.9, 0, Math.PI * 2); ctx.stroke();
      if (k < 0.3) rays.forEach(r => particles.push({ r, p: k * 0.1, v: 0.012 + Math.random() * 0.01 }));
    });

    if (!reduce) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
