steps:
  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/portfolio-prism/portfolio-prism'
      - '.'

  # 2. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/portfolio-prism/portfolio-prism'

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'portfolio-prism'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/portfolio-prism/portfolio-prism'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # 512 MiB (the default) is too small: Python + pandas + statsmodels
      # + matplotlib alone take ~250 MB, and chart rendering adds more.
      - '--memory'
      - '1Gi'

options:
  logging: CLOUD_LOGGING_ONLY
